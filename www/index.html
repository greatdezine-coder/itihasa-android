{t:"Indira Gandhi",w:"Indira Gandhi",img:"Indira_Gandhi_official_portrait.png",y:1966,e:1984,d:"1917–1984 · Prime Minister 1966–77 and 1980–84",era:"rep",r:["Pan-India"],c:"per",k:"indira gandhi first woman prime minister bank nationalisation 1969 garibi hatao 1971 war bangladesh emergency 1975 pokhran 1974 operation blue star assassinated 1984",s:"India's first woman Prime Minister, who led India to victory in the 1971 war and imposed the Emergency of 1975–77.",x:"Daughter of Jawaharlal Nehru, Indira Gandhi became Prime Minister in 1966. She nationalised fourteen major banks in 1969, won a landslide in 1971 with the slogan 'Garibi Hatao' (remove poverty), and led India to victory in the 1971 war that created Bangladesh. India's first nuclear test took place in 1974. In 1975 she declared a national Emergency, suspending civil liberties; she lost the 1977 election but returned to power in 1980. In June 1984 she ordered Operation Blue Star to remove armed militants from the Golden Temple in Amritsar. On 31 October 1984 she was assassinated by two of her bodyguards."},
{t:"Chipko Movement",w:"Chipko movement",img:"Chipko_2004.jpg",y:1973,e:1980,d:"from 1973",era:"rep",r:["North"],c:"evt",k:"chipko movement 1973 tree hugging uttarakhand garhwal chamoli gaura devi reni sunderlal bahuguna chandi prasad bhatt forest conservation environment",s:"A forest-protection movement that began in 1973 in the Himalayan villages of Uttarakhand, where villagers hugged trees to stop them being cut.",x:"In 1973 villagers in Chamoli district of present-day Uttarakhand, organised by Chandi Prasad Bhatt's cooperative, protested against the felling of trees by contractors. In 1974 at Reni village, women led by Gaura Devi stopped loggers by hugging the trees — 'chipko' means to cling. Sunderlal Bahuguna spread the message through long marches. The movement led to a 15-year ban on the felling of green trees in the Himalayan forests of Uttar Pradesh in 1980 and inspired environmental movements across India."},
{t:"A. P. J. Abdul Kalam",w:"A. P. J. Abdul Kalam",img:"A._P._J._Abdul_Kalam.jpg",y:1980,e:2015,d:"1931–2015 · President 2002–2007",era:"rep",r:["South", "Pan-India"],c:"per",k:"apj abdul kalam missile man of india people's president slv 3 rohini 1980 agni prithvi pokhran ii 1998 11th president wings of fire rameswaram bharat ratna 1997",s:"The 'Missile Man of India' and 'People's President', a scientist who led India's rocket and missile programmes and was President from 2002 to 2007.",x:"Born in 1931 in Rameswaram, Tamil Nadu, Avul Pakir Jainulabdeen Abdul Kalam sold newspapers as a boy to help his family. At ISRO he was project director of the SLV-3, which placed the Rohini satellite in orbit in 1980. At DRDO he led the Integrated Guided Missile Development Programme that produced missiles such as Agni and Prithvi, and he played a key role in the Pokhran-II nuclear tests of 1998. He received the Bharat Ratna in 1997 and was the 11th President of India from 2002 to 2007, loved especially by students. His autobiography is Wings of Fire. He died while giving a lecture in Shillong in 2015."},
{t:"Panchayati Raj",w:"Panchayati raj in India",img:"Maravanthe_Gram_Panchayat_Office.jpg",y:1959,e:1993,d:"first panchayats 1959 · constitutional status 1993",era:"rep",r:["Pan-India"],c:"evt",k:"panchayati raj local self government gram panchayat 73rd 74th amendment 1992 balwant rai mehta nagaur 1959 national panchayati raj day 24 april three tier women one third",s:"India's system of village self-government, given constitutional status by the 73rd Amendment in 1993.",x:"Following the Balwant Rai Mehta Committee's recommendations, the first panchayati raj system was inaugurated by Jawaharlal Nehru at Nagaur in Rajasthan on 2 October 1959, with a three-tier structure of village, block and district councils. Because states implemented it unevenly, the 73rd Constitutional Amendment, passed in 1992 and effective from 24 April 1993, made panchayats a constitutional institution with regular elections, and reserved at least one-third of seats for women. The 74th Amendment did the same for municipalities. 24 April is celebrated as National Panchayati Raj Day."},
{t:"Kargil War",w:"Kargil War",img:"Kargil_war.jpg",y:1999,e:1999,d:"May–July 1999",era:"rep",r:["North"],c:"war",k:"kargil war 1999 operation vijay tololing tiger hill drass vikram batra yogendra singh yadav kargil vijay diwas 26 july line of control",s:"A conflict in the Kargil heights of Ladakh in 1999, in which India drove back Pakistani forces that had crossed the Line of Control.",x:"In the spring of 1999 Pakistani soldiers and militants secretly occupied high mountain posts on the Indian side of the Line of Control in Kargil district. India launched Operation Vijay to recapture them, with fierce battles at Tololing, Tiger Hill and other peaks above 5,000 metres, supported by the Air Force's Operation Safed Sagar. Captain Vikram Batra, Grenadier Yogendra Singh Yadav and others won the Param Vir Chakra. By July the positions had been retaken. 26 July is observed as Kargil Vijay Diwas."},
{t:"Revocation of Article 370",w:"Revocation of the special status of Jammu and Kashmir",img:"Dal_Lake,_Srinagar,_Jammu_and_Kashmir.jpg",y:2019,e:2019,d:"5 August 2019",era:"rep",r:["North"],c:"evt",k:"article 370 abrogation revocation 2019 jammu and kashmir special status ladakh union territories reorganisation act supreme court 2023",s:"In August 2019 the special status of Jammu and Kashmir under Article 370 was revoked and the state was split into two union territories.",x:"Article 370 of the Constitution had given the state of Jammu and Kashmir special autonomy. On 5 August 2019 a Presidential order and a resolution of Parliament made its special provisions inoperative, and the Jammu and Kashmir Reorganisation Act divided the state into two union territories — Jammu and Kashmir, and Ladakh — from 31 October 2019. In December 2023 the Supreme Court upheld the decision. Elections to the Jammu and Kashmir assembly were held in 2024."},
{t:"COVID-19 Pandemic in India",w:"COVID-19 pandemic in India",img:"Covaxin_vaccine.jpg",y:2020,e:2022,d:"2020–2022",era:"rep",r:["Pan-India"],c:"evt",k:"covid 19 coronavirus pandemic india lockdown 2020 vaccination covishield covaxin second wave delta 2021 vaccine maitri",s:"The coronavirus pandemic reached India in January 2020, leading to a nationwide lockdown and one of the world's largest vaccination drives.",x:"India's first COVID-19 case was reported in Kerala on 30 January 2020, and a nationwide lockdown began on 25 March 2020. A devastating second wave in April–May 2021, driven by the Delta variant, overwhelmed hospitals and caused shortages of oxygen. India began vaccinating on 16 January 2021 with Covishield and the indigenous Covaxin, crossed one billion doses in October 2021 and two billion by July 2022, and supplied vaccines to other countries under Vaccine Maitri."},
{t:"G20 New Delhi Summit",w:"2023 G20 New Delhi summit",img:"Bharat_Mandapam_Morning_View.jpg",y:2023,e:2023,d:"9–10 September 2023",era:"rep",r:["North"],c:"evt",k:"g20 presidency india 2023 new delhi summit bharat mandapam vasudhaiva kutumbakam one earth one family one future african union",s:"India held the G20 presidency in 2023 and hosted the leaders' summit in New Delhi, where the African Union became a permanent member.",x:"India took over the presidency of the Group of Twenty, the forum of the world's major economies, on 1 December 2022, with the theme 'Vasudhaiva Kutumbakam — One Earth, One Family, One Future'. Meetings were held in cities across the country. The leaders' summit took place at the new Bharat Mandapam convention centre in New Delhi on 9–10 September 2023, where the African Union was admitted as a permanent member and a joint leaders' declaration was adopted."},
{t:"New Parliament House",w:"New Parliament House, New Delhi",img:"Glimpse_of_the_new_Parliament_Building,_in_New_Delhi.jpg",y:2023,e:2023,d:"inaugurated 28 May 2023",era:"rep",r:["North"],c:"art",k:"new parliament house sansad bhavan 2023 inauguration 28 may central vista sengol lok sabha rajya sabha bimal patel triangular",s:"India's new triangular Parliament building in New Delhi, inaugurated on 28 May 2023.",x:"As part of the Central Vista redevelopment, a new Parliament House was built next to the old circular building of 1927. Designed by the architect Bimal Patel, the triangular building has larger chambers for the Lok Sabha and Rajya Sabha, themed on the national bird, the peacock, and the national flower, the lotus. Prime Minister Narendra Modi inaugurated it on 28 May 2023, and a historic sengol (sceptre) was installed near the Speaker's chair. Parliament began working in the new building in September 2023, where the Women's Reservation Bill was the first bill passed."},

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’‘]/g,"'");
const stem=w=>{if(w.length>4&&w.endsWith("ies"))return w.slice(0,-3)+"y";if(w.length>3&&w.endsWith("s")&&!/(ss|us|is)$/.test(w))return w.slice(0,-1);return w};
const tok=s=>norm(s).replace(/[^a-z0-9]+/g," ").split(" ").filter(w=>w.length>1).map(stem);
const fy=y=>y<0?`${Math.abs(y).toLocaleString("en-IN")} BCE`:(y<1000?`${y} CE`:`${y}`);
const dateLabel=it=>it.d||(it.e!==it.y?`${fy(it.y)} – ${fy(it.e)}`:fy(it.y));
const ordinal=n=>n+(["th","st","nd","rd"][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]||"th");
const eraOf=id=>ERAS.find(e=>e.id===id);

D.forEach((it,i)=>{it.id=i;if(it.e==null)it.e=it.y;it.T=new Set(tok(it.t));it.K=new Set(tok(it.k));it.S=" "+tok(it.s).join(" ")+" ";it.X=" "+tok(it.x).join(" ")+" ";it.TT=" "+tok(it.t).join(" ")+" ";});
const CHRONO=[...D].sort((a,b)=>a.y-b.y||a.e-b.e);

const STOP=new Set("a an the of in on at to for from by with and or is was were are be been being who whom whose what when where which why how tell me us about show give list did do does done happen happened happening history historical please can could you would i we want know more some any all there their it its as into that this those these during around era period age time times year years thing things anything everything something explain describe define meaning mean say talk info information detail details important famous major main best event incident".split(" ").map(stem));
const ORD={first:1,second:2,third:3,fourth:4,fifth:5,sixth:6,seventh:7,eighth:8,ninth:9,tenth:10,eleventh:11,twelfth:12,thirteenth:13,fourteenth:14,fifteenth:15,sixteenth:16,seventeenth:17,eighteenth:18,nineteenth:19,twentieth:20};
const PERIODS=[

];
const REG=[

];
const CATRX=[
 [/^(battle|war|fight|fighting|invasion|invader|conquest|military|revolt|rebellion|uprising|army|armie)$/,"war"],

];
const catOfWord=w=>{for(const [rx,c] of CATRX)if(rx.test(w))return c;return null};

function parseQuery(raw){
  const q={raw,words:[],from:null,to:null,year:null,regions:new Set(),who:false,labels:[]};
  let s=" "+norm(raw).replace(/\b(article|section|amendment|no\.?|number)\s+\d+/g," ").replace(/\bb\.\s*c\.?\s*(e\.?)?/g," bc ").replace(/\ba\.\s*d\.?/g," ad ").replace(/[-–—]/g," ").replace(/[?!.,;:"]/g," ")+" ";
  s=s.replace(/\bbce\b/g,"bc").replace(/\bce\b/g,"ad").replace(/\b(\d+)(bc|ad)\b/g,"$1 $2");
  if(/\b(who|whom|whose)\b/.test(s))q.who=true;
  s=s.replace(/\btwenty ?first century/g,"21 century");
  s=s.replace(new RegExp("\\b("+Object.keys(ORD).join("|")+")\\s+century","g"),(m,w)=>ORD[w]+" century");
  s=s.replace(/\b(\d{1,2})(?:st|nd|rd|th)?\s+century\s*(bc|ad)?/g,(m,n,e)=>{n=+n;if(e==="bc"){q.from=-n*100;q.to=-(n-1)*100-1;q.labels.push(`the ${ordinal(n)} century BCE`)}else{q.from=(n-1)*100;q.to=n*100-1;q.labels.push(`the ${ordinal(n)} century`)}return " "});
  s=s.replace(/\b(?:from|between)\s+(?:the\s+year\s+)?(\d{1,5})\s*(bc|ad)?\s+(?:to|and|till|until|upto|up to)\s+(\d{1,5})\s*(bc|ad)?/g,(m,a,ea,b,eb)=>{if(q.from!==null)return " ";if(eb==="bc"&&!ea)ea="bc";let A=ea==="bc"?-a:+a,B=eb==="bc"?-b:+b;q.from=Math.min(A,B);q.to=Math.max(A,B);q.labels.push(`${fy(q.from)} to ${fy(q.to)}`);return " "});
  s=s.replace(/\b(1\d{3}|20\d{2})s\b/g,(m,d)=>{if(q.from===null){q.from=+d;q.to=+d+9;q.labels.push(`the ${d}s`)}return " "});
  s=s.replace(/\b(\d{1,5})\s*(bc|ad)\b|\b(\d{3,4})\b/g,(m,a,e,b)=>{if(q.year!==null||q.from!==null)return " ";const n=a?(e==="bc"?-a:+a):+b;q.year=n;q.labels.push(fy(n));return " "});
  s=s.replace(/\b(bc|ad)\b/g," ");
  if(q.from===null&&q.year===null){for(const [rx,f,t,l] of PERIODS){if(rx.test(s)){q.from=f;q.to=t;q.labels.push(l);s=s.replace(rx," ");break}}}
  const RL={Central:"central India",Northeast:"north-east India",Northwest:"north-west India",North:"northern India",South:"southern India",East:"eastern India",West:"western India"};
  for(const [rx,r] of REG){if(r==="East"&&/\beast india company\b/.test(s))continue;if(rx.test(s)){q.regions.add(r);q.labels.push(RL[r]);s=s.replace(rx," ")}}
  const words=tok(s).filter(w=>!STOP.has(w)&&!/^\d+$/.test(w)&&w!=="india"&&w!=="indian");
  q.words=[...new Set(words)];
  q.phrase=" "+q.words.join(" ")+" ";
  return q;
}

function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const pre=(a,b)=>a.length>=4&&b.length>=4&&(a.startsWith(b)||b.startsWith(a));

const GENERIC=new Set("write wrote written writer writing built build building made make founded found founder ruled rule ruler fought invented invent discovered created create started start began begin led lead died die born won win lost kill killed became become called known name named did gave give took take used use lived live came come went go defeated defeat said say first last".split(" ").map(stem));
function wordScore(it,w){
  let b=0;
  if(it.T.has(w))b=12;else if(it.K.has(w))b=7;
  else{
    for(const t of it.T)if(pre(t,w)){b=8;break}
    if(b<5)for(const t of it.K)if(pre(t,w)){b=Math.max(b,5);break}
    if(!b){if(it.S.includes(" "+w))b=3;else if(it.X.includes(" "+w))b=1.5}
    if(!b&&w.length>=5){const tol=w.length>=9?2:1,ok=t=>t[0]===w[0]&&Math.abs(t.length-w.length)<=tol&&lev(t,w)<=tol;for(const t of it.T)if(ok(t)){b=5;break}if(!b)for(const t of it.K)if(ok(t)){b=4;break}}
  }
  const c=catOfWord(w);if(c&&it.c===c)b=Math.max(b,6);
  return b;
}
function scoreItem(it,q){
  let total=0,matched=0,content=0;
  for(const w of q.words){const b=wordScore(it,w);if(b){total+=b;matched++;if(!GENERIC.has(w))content++}}
  if(!total)return 0;
  if(q.content.length&&!content)return 0;
  if(q.words.length>1&&it.TT.includes(q.phrase))total+=15;
  total*=0.45+0.55*matched/q.words.length;
  if(q.who&&it.c==="per")total*=1.3;
  return total;
}

function search(raw,pool){
  const q=parseQuery(raw);
  let P=pool.slice();
  if(q.from!==null){const ov=P.filter(it=>it.e>=q.from&&it.y<=q.to),inside=ov.filter(it=>it.y>=q.from);P=inside.length>=3?inside:ov}
  if(q.year!==null){
    const Y=q.year,hit=P.filter(it=>it.y<=Y&&it.e>=Y);
    if(hit.length<3){const tol=Y<0?300:(Y<1500?60:15);const near=P.filter(it=>!hit.includes(it)).map(it=>[it,Math.min(Math.abs(it.y-Y),Math.abs(it.e-Y))]).filter(x=>x[1]<=tol).sort((a,b)=>a[1]-b[1]).slice(0,5-hit.length).map(x=>x[0]);q.near=near.length>0;P=hit.concat(near)}else P=hit;
  }
  if(q.regions.size){const R=P.filter(it=>it.r.some(r=>q.regions.has(r)));if(R.length)P=R;else q.regionIgnored=true}
  let res;const constrained=q.from!==null||q.year!==null||q.regions.size>0;
  q.content=q.words.filter(w=>!GENERIC.has(w));
  q.unknown=q.content.filter(w=>!D.some(it=>wordScore(it,w)>0));
  if((q.content.length&&q.unknown.length*2>q.content.length)||(q.words.length&&!q.content.length&&q.from===null&&q.year===null&&!q.regions.size)){res=[];q.mode="none";return {q,res}}
  if(q.words.length){
    let sc=P.map(it=>({it,s:scoreItem(it,q)})).filter(x=>x.s>0);
    if(sc.length){const mx=Math.max(...sc.map(x=>x.s));sc=sc.filter(x=>x.s>=mx*0.3).sort((a,b)=>b.s-a.s||a.it.y-b.it.y);res=sc.map(x=>x.it);q.mode="keyword";q.topScore=sc[0].s;q.second=sc[1]?sc[1].s:0;const tc=q.content.length?q.content:q.words;q.cov=tc.filter(w=>wordScore(res[0],w)>0).length/tc.length}
    else if(constrained){res=P;q.mode="browse";q.wordsIgnored=true}
    else{res=[];q.mode="none"}
  }else{res=P;q.mode=constrained?"browse":"none"}
  if(q.mode==="browse"){if(q.year!==null){const Y=q.year,rk=it=>(it.y<=Y&&it.e>=Y?0:4)+(it.y===Y||it.e===Y||(Y>999&&(it.x+" "+it.s+" "+(it.d||"")).includes(String(Y)))?0:2)+(it.c==="per"?1:0);res.sort((a,b)=>rk(a)-rk(b)||(a.e-a.y)-(b.e-b.y)||Math.abs(a.y-Y)-Math.abs(b.y-Y))}else res.sort((a,b)=>a.y-b.y)}
  return {q,res};
}

function timeline(list){const sorted=[...list].sort((a,b)=>a.y-b.y);let html='<div class="tl">',cur="";for(const it of sorted){if(it.era!==cur){cur=it.era;const e=eraOf(cur);html+=`<h4 style="--c:${e.c}">${esc(eraName(e))}<small>${esc(eraSpan(e))}</small></h4>`}html+=`<button class="tli" data-id="${it.id}">${ph(it,160)}<span class="y">${esc(dateLabel(it))}</span><span><b>${esc(it.t)}</b><span class="s">${esc(it.s)}</span></span></button>`}return html+"</div>"}
function render(){
  document.querySelectorAll(".era").forEach(b=>b.classList.toggle("on",b.dataset.era===state.era));
  let pool=applyUI(D),res,q=null;
  if(state.q){({q,res}=search(state.q,pool));if(!res.length&&state.q)res=pool.slice().sort((a,b)=>a.y-b.y)}else res=pool.slice().sort((a,b)=>a.y-b.y);
  const bits=[];if(state.era)bits.push(eraName(eraOf(state.era)));if(state.region)bits.push(regionName(state.region));if(state.cat)bits.push(catName(state.cat));if(state.from!=null)bits.push("≥ "+fy(state.from));if(state.to!=null)bits.push("≤ "+fy(state.to));
  $("#meta").textContent=T("showing",{n:res.length,t:D.length})+(bits.length?" · "+bits.join(" · "):"");

}

const WEAK=new Set(["great","the","of","and","battle","empire","dynasty","age","india","movement","first","rani"]);
function related(it){const sc=D.filter(o=>o!==it).map(o=>{let s=0;for(const k of it.K)if(o.K.has(k)&&k.length>3)s+=2;for(const k of it.T)if(!WEAK.has(k)&&(o.K.has(k)||o.T.has(k)))s+=3;if(o.era===it.era)s+=1;return [o,s]}).filter(x=>x[1]>2).sort((a,b)=>b[1]-a[1]);return sc.slice(0,5).map(x=>x[0])}
const exampleHTML=()=>`<p class="ex">${esc(T("forExample"))} “Who was Razia Sultan?”, “Hampi”, “What happened in 1757?”, “Temples of south India”.</p>`;
function figFor(it){return it?`<button class="figbtn" data-zoom="${it.id}">${ph(it,640)}</button>`:""}
function mosaic(list){return `<div class="mosaic">${list.slice(0,4).map(r=>`<button class="figbtn" data-open="${r.id}" title="${esc(r.t)}">${ph(r,300)}</button>`).join("")}</div>`}
function listHTML(list,n){return `<ul class="alist">${list.slice(0,n).map(r=>`<li><button data-open="${r.id}">${esc(r.t)}</button> <span>— ${esc(dateLabel(r))}</span></li>`).join("")}</ul>`}
/* fills the answer card. a = {kicker,title,line,when,body,fig,more,moreActions,related,say,moreSay,top} */
function paint(a,raw){
  $("#asked").textContent=T("youAsked")+": "+raw;
  $("#aKicker").textContent=a.kicker||"";$("#aKicker").hidden=!a.kicker;
  $("#aTitle").textContent=a.title||"";$("#aLine").textContent=a.line||"";$("#aLine").hidden=!a.line;
  $("#aWhen").textContent=a.when||"";$("#aBody").innerHTML=a.body||"";
  $("#aFig").innerHTML=a.fig||"";$("#aGrid").classList.toggle("nofig",!a.fig);
  const hasMore=!!a.more;$("#aMoreBtn").hidden=!hasMore;$("#aMore").hidden=true;setMoreBtn(false);
  $("#aMoreText").innerHTML=a.more||"";$("#aMoreActions").innerHTML=a.moreActions||"";
  $("#aRel").innerHTML=(a.related||[]).map(r=>`<button class="chip" data-open="${r.id}">${esc(r.t)}</button>`).join("");$("#aRelWrap").hidden=!(a.related&&a.related.length);
  lastTop=a.top||null;lastAnswerSay=a.say||"";lastMoreSay=a.moreSay||"";
  const box=$("#answer");box.classList.remove("show");void box.offsetWidth;box.classList.add("show");
}
function setMoreBtn(open){const b=$("#aMoreBtn");b.setAttribute("aria-expanded",open);b.classList.toggle("open",open);b.querySelector("span").textContent=open?T("showLess"):T("knowMore")}
function toggleMore(force){const m=$("#aMore");const open=force!==undefined?force:m.hidden;m.hidden=!open;setMoreBtn(open);if(open)setTimeout(()=>m.scrollIntoView({behavior:"smooth",block:"nearest"}),60);return open}
const paraHTML=t=>sentences(t).length?`<p>${esc(t)}</p>`:"";
function factAnswer(f,raw){
  const it=f.e?byTitle(f.e):null;
  const line=firstSentence(f.s),rest=restSentences(f.s);
  let more="";if(rest)more+=`<p>${esc(rest)}</p>`;
  if(it)more+=`<h4 class="more-h">${esc(T("about"))}: ${esc(it.t)} <small>${esc(dateLabel(it))}</small></h4><p class="lead-s">${esc(it.s)}</p><p>${esc(it.x)}</p>`;
  return {kicker:T("quick"),title:f.a,line,fig:figFor(it),more:more||null,moreActions:it?`<button class="btn" data-open="${it.id}">${esc(T("readFull"))}</button>`:"",related:it?related(it).slice(0,4):[],top:it,say:line,moreSay:(rest?rest+" ":"")+(it?it.t+". "+it.s+" "+it.x:"")};
}
function entryAnswer(t,res){
  const e=eraOf(t.era);
  return {kicker:`${eraName(e)} · ${catName(t.c)}`,title:t.t,line:t.s,when:dateLabel(t),fig:figFor(t),more:`<p>${esc(t.x)}</p>`+factsList(t,4),moreActions:`<button class="btn" data-open="${t.id}">${esc(T("readFull"))}</button>`,related:res.slice(1,5).concat(related(t)).filter((x,i,a)=>x!==t&&a.indexOf(x)===i).slice(0,5),top:t,say:`${t.t}. ${t.s}`,moreSay:t.x};
}
function factsList(it,n){const fs=(FACTS_BY_ENTRY[it.t]||[]).slice(0,n);return fs.length?`<h4 class="more-h">${esc(T("quickFacts"))}</h4><ul class="qf">${fs.map(f=>`<li><button data-fact="${f.id}">${esc(f.q)}</button> <b>${esc(f.a)}</b></li>`).join("")}</ul>`:""}
function decideAndPaint(raw){
  const d=decide(raw,applyUI(D));const q=d.q,res=d.res;
  if(d.kind==="fact"){const a=factAnswer(d.m.f,raw);paint(a,raw);return {say:a.say,kind:d.kind}}
  if(d.kind==="offtopic"){paint({title:T("offTitle"),body:`<p>${esc(T("offBody"))}</p>`+exampleHTML(),say:T("offTitle")+" "+T("offBody"),sayLang:LANG},raw);return {say:T("offTitle")+" "+T("offBody"),kind:d.kind,lang:LANG}}
  if(d.kind==="missing"){paint({title:T("missTitle"),body:`<p>${esc(T("missBody"))}</p>`+exampleHTML()},raw);return {say:T("missTitle")+". "+T("missBody"),kind:d.kind,lang:LANG}}
  if(d.kind==="weak"){paint({title:T("weakTitle"),when:T("weakWhen"),fig:mosaic(res),body:listHTML(res,5)},raw);return {say:T("weakTitle")+". "+res.slice(0,3).map(r=>r.t).join(", "),kind:d.kind,lang:LANG}}
  if(d.kind==="entry"){const a=entryAnswer(res[0],res);paint(a,raw);return {say:a.say,kind:d.kind}}
  const label=q.labels.length?q.labels.join(", "):raw;
  const title=q.year!==null?T("around",{y:fy(q.year)}):(q.mode==="keyword"?T("entriesMatch",{n:res.length}):T("entriesFor",{n:res.length,l:label}));
  paint({title,when:q.near?T("near"):"",fig:mosaic(res),body:listHTML(res,6)+(res.length>6?`<p class="ex">${esc(T("andMore",{n:res.length-6}))}</p>`:""),top:res[0]},raw);
  return {say:(q.year!==null?`Here is what I found around ${fy(q.year)}. `:`I found ${res.length} entries. `)+res.slice(0,3).map(r=>`${r.t}, ${dateLabel(r)}.`).join(" "),kind:"list"};
}

/* ---------- Wikipedia fallback (online only) ---------- */
const WK_MEDIA_T=/\((film|[0-9]{4} film|tv series|television series|web series|song|album|soundtrack|novel|play|band|video game|magazine|newspaper)\)/i;
const WK_MEDIA_S=/\b(film|movie|television series|tv series|web series|soap opera|serial|drama|biopic|album|single|song|video game|documentary)\b/i;
const WK_INST=/\b(university|vishwavidyalaya|college|school|airport|station|stadium|hospital|institute|award|express|district|nagar|road|marg)\b/i;
const WK_STOP=new Set("a an the of in on at to for from by with and or is was were are be been who whom whose what when where which why how did does do tell me about please".split(" "));
let askToken=0;
async function wikiFallback(raw,tokn){
  if(!navigator.onLine)return null;
  try{
    const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),4500);
    const qw=norm(raw).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2&&!WK_STOP.has(w));const kw=qw.filter(w=>w!=="first");if(!kw.length)return null;
    const r=await fetch("https://en.wikipedia.org/w/api.php?"+new URLSearchParams({action:"query",format:"json",formatversion:"2",origin:"*",generator:"search",gsrsearch:qw.join(" "),gsrlimit:"8",prop:"extracts|pageimages",exintro:"1",explaintext:"1",exsentences:"5",exlimit:"8",piprop:"thumbnail",pithumbsize:"640",pilicense:"free"}),{signal:ctl.signal});
    clearTimeout(tm);const j=await r.json();
    const tw=p=>norm(p.title).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean);
    const ov=p=>kw.filter(w=>tw(p).some(t=>t.startsWith(w.replace(/s$/,""))||(t.length>3&&w.startsWith(t)))).length;
    const ps=((j.query&&j.query.pages)||[]).filter(p=>p.extract&&p.extract.length>80&&!WK_MEDIA_T.test(p.title)&&!WK_MEDIA_S.test(firstSentence(p.extract))&&!/may refer to/.test(p.extract)&&INDIA_RX.test(p.title+" "+sentences(p.extract).slice(0,2).join(" "))&&ov(p)>0);
    const sc=p=>ov(p)*2-Math.max(0,tw(p).length-ov(p))*0.4-(WK_INST.test(p.title)?1.5:0)-p.index*0.15;
    ps.sort((a,b)=>sc(b)-sc(a));const pg=ps[0];
    if(!pg||tokn!==askToken)return null;
    const ss=sentences(pg.extract),url="https://en.wikipedia.org/wiki/"+encodeURIComponent(pg.title.replace(/ /g,"_"));
    paint({kicker:"Wikipedia",title:pg.title,line:ss[0],when:T("wikiWhen"),fig:pg.thumbnail?`<div class="ph"><img alt="" src="${esc(pg.thumbnail.source)}"></div>`:"",
      more:`<p>${esc(ss.slice(1,5).join(" "))}</p><p class="ex"><a href="${url}" target="_blank" rel="noopener">${esc(T("wikiNote"))}</a></p>`,say:`From Wikipedia: ${ss[0]}`,moreSay:ss.slice(1,5).join(" ")},raw);
    return `From Wikipedia: ${ss[0]}`;
  }catch(e){return null}
}

/* ================= QUERY ================= */
function runQuery(text,{spoken=false}={}){
  const t=norm(text).trim().replace(/[.!?]+$/,"");
  if(!t){resetAll();return}
  hideOSK();
  if(/^(stop|stop speaking|stop talking|quiet|silence|be quiet)$/.test(t)){stopSpeaking();input.value="";return}
  if(/^(reset|clear|start over|go home|home)$/.test(t)){resetAll();return}
  if(/^(quiz|quiz me|ask me a question|test me)$/.test(t)){input.value="";openQuiz();return}
  if(/surprise me|random|something interesting|any fact/.test(t)){input.value="";surprise(spoken);return}
  if(/^(tell me more|more|know more|read more|continue|go on|explain more|full story)$/.test(t)){input.value="";if($("#answer").classList.contains("show")&&!$("#aMoreBtn").hidden){toggleMore(true);if(lastMoreSay)speak(lastMoreSay,$("#aListen"))}else if(current||lastTop){const it=current||lastTop;openDetail(it);speak(fullSay(it),$("#dListen"))}return}
  if(/^(next|later|after that)$/.test(t)&&current){step(1);return}
  if(/^(previous|earlier|before that|back)$/.test(t)&&current){step(-1);return}
  if(/^(show (the )?(picture|image|photo)s?|show me)$/.test(t)&&(current||lastTop)){const it=current||lastTop;if(it.img)zoom(it.img);return}
  state.q=text;input.value=text;
  document.querySelectorAll("dialog[open]").forEach(d=>d.close());
  render();
  const tokn=++askToken;
  const wantSpeak=settings.auto==="always"||(settings.auto==="voice"&&spoken);
  const r=decideAndPaint(text);
  const sayIt=(s,lang)=>{if(!wantSpeak||!s)return;if(lang&&lang!=="en"){if(!speak(s,$("#aListen"),lang))speak(lang==="en"?s:englishFor(r.kind),$("#aListen"))}else speak(s,$("#aListen"))};
  if((r.kind==="missing"||r.kind==="weak")&&navigator.onLine){
    wikiFallback(text,tokn).then(w=>{if(tokn!==askToken)return;if(w)sayIt(w);else sayIt(r.say,r.lang)});
  }else sayIt(r.say,r.lang);
  $("#answer").scrollIntoView({behavior:"smooth",block:"start"});
}
function englishFor(kind){const L=LANG;LANG="en";const s=kind==="offtopic"?T("offTitle")+" "+T("offBody"):kind==="missing"?T("missTitle"):T("weakTitle");LANG=L;return s}
$("#searchForm").addEventListener("submit",e=>{e.preventDefault();input.blur();runQuery(input.value)});

}

/* ================= ON-SCREEN KEYBOARD ================= */
const OSK_ROWS=[["1","2","3","4","5","6","7","8","9","0"],["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l","'"],["z","x","c","v","b","n","m","-",",","?"]];
const coarse=()=>window.matchMedia&&window.matchMedia("(pointer: coarse)").matches;
const oskWanted=()=>settings.kb==="on"||(settings.kb==="auto"&&coarse());
function buildOSK(){const o=$("#osk");o.innerHTML=OSK_ROWS.map(r=>`<div class="osk-row">${r.map(k=>`<button type="button" data-k="${k}">${k}</button>`).join("")}</div>`).join("")+
  `<div class="osk-row"><button type="button" class="wide" data-k="clear">✕</button><button type="button" class="space" data-k=" ">space</button><button type="button" class="wide" data-k="back">⌫</button><button type="button" class="wide go2" data-k="go">${esc(T("search"))} ↵</button><button type="button" class="wide" data-k="hide">⌄</button></div>`}
function showOSK(force){if(!force&&!oskWanted())return;const o=$("#osk");if(!o.innerHTML)buildOSK();o.hidden=false;document.body.classList.add("osk-open")}
function hideOSK(){$("#osk").hidden=true;document.body.classList.remove("osk-open")}
function applyKbMode(){input.setAttribute("inputmode",oskWanted()?"none":"search")}
input.addEventListener("focus",()=>showOSK());
$("#osk").addEventListener("pointerdown",e=>{const b=e.target.closest("button");if(!b)return;e.preventDefault();const k=b.dataset.k;

/* Turn a heard sentence into the question we search for. */

  if (!t) return "";
  t = SoundFix.dedupe(t);
  if ((t.match(/,/g) || []).length >= 4) return "";                 // looks like the name list it was primed with
  let fixed = SoundFix.fix(t);
  const d = decide(fixed);
  if (d.kind === "offtopic" || d.kind === "missing") { const k = SoundFix.knownOnly(fixed); if (k && k !== fixed) { const d2 = decide(k); if (d2.kind !== "offtopic" && d2.kind !== "missing") fixed = k; } }

    status("");
    runQuery(q, { spoken: true });
  } catch (err) {
    micState("");
    const msg = String(err && err.message || err);
    if (/pack missing|missing itihasa-voice/.test(msg)) status(T("voiceMissing"), true);
    else if (/Permission|NotAllowed/i.test(msg)) status("Microphone access was blocked. Open the app with the 'Start Itihasa' launcher so the microphone is allowed.", true);
    else if (/NotFound|device/i.test(msg)) status("No microphone was found.", true);
    else status(T("voiceFailed") + " (" + msg + ")", true);
    showOSK(true);
  } finally { OV.busy = false; }
}
function chromeLocalListen() {
  const r = new SR(); r.lang = "en-US"; r.interimResults = true; r.processLocally = true;
  let finalText = "";
  r.onstart = () => { micState("rec"); status(T("listening")); };
  r.onresult = e => { let interim = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const x = e.results[i]; if (x.isFinal) finalText += x[0].transcript; else interim += x[0].transcript; } input.value = (finalText + " " + interim).trim(); };
  r.onerror = e => { if (e.error !== "aborted" && e.error !== "no-speech") status("Chrome's offline speech: " + e.error, true); };
  r.onend = () => { micState(""); const q = cleanSpoken(finalText); if (q) { status(""); runQuery(q, { spoken: true }); } };
  try { r.start(); } catch (e) { status(T("voiceFailed"), true); }
}
/* Warm the engine up in the background so the first question is quick. */
async function preloadVoice() {
  if (OV.ready || OV.busy || !micAllowedHere()) return;
  try {
    OV.busy = true;
    await OV.ensureInstalled();          // first run: copies the pack from the folder (quietly, in the background)
    OV.busy = false;
    await OV.startWorker();
  } catch (e) { } finally { OV.busy = false; }
}
