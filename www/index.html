{t:"Nadir Shah's Invasion",w:"Nader Shah's invasion of the Mughal Empire",img:"Nadir_Shah_at_the_sack_of_Delhi_-_Battle_scene_with_Nader_Shah_on_horseback,_possibly_by_Muhammad_Ali_ibn_Abd_al-Bayg_ibn_Ali_Quli_Jabbadar,_mid-18th_century,_Museum_of_Fine_Arts,_Boston.jpg",y:1739,era:"mug",r:["North"],c:"war",k:"nadir shah persia karnal sack of delhi peacock throne koh i noor kohinoor muhammad shah invasion",s:"The Persian ruler Nadir Shah sacked Delhi and carried away the Peacock Throne and the Koh-i-Noor.",x:"After defeating the Mughal emperor Muhammad Shah at Karnal in 1739, Nadir Shah entered Delhi, where a massacre followed a riot against his troops. He returned home with immense treasure, including Shah Jahan's Peacock Throne and the Koh-i-Noor diamond. The invasion exposed how weak the Mughals had become."},
{t:"Battle of Plassey",w:"Battle of Plassey",img:"Lord_Clive_meeting_with_Mir_Jafar_after_the_Battle_of_Plassey.jpg",y:1757,era:"cmp",r:["East"],c:"war",k:"plassey palashi robert clive siraj ud daulah mir jafar bengal east india company british battle",s:"Robert Clive's victory over Siraj-ud-Daulah, which made the East India Company the power in Bengal.",x:"On 23 June 1757, at Palashi in Bengal, the Company's small army under Robert Clive defeated the Nawab Siraj-ud-Daulah, largely because the Nawab's commander Mir Jafar had been won over and held back his troops. Mir Jafar was made Nawab, and the Company gained enormous wealth and influence. Many historians date the beginning of British rule in India from Plassey."},
{t:"Third Battle of Panipat",w:"Third Battle of Panipat",img:"The_Third_battle_of_Panipat_13_January_1761.jpg",y:1761,era:"cmp",r:["North"],c:"war",k:"third battle of panipat marathas maratha ahmad shah abdali durrani sadashivrao bhau afghan",s:"Ahmad Shah Abdali defeated the Marathas in one of the largest battles of the 18th century.",x:"On 14 January 1761 the Maratha army under Sadashivrao Bhau met the Afghan ruler Ahmad Shah Durrani, also called Abdali, at Panipat. The Marathas suffered a crushing defeat with very heavy losses. Although they recovered within a decade, the battle checked their power in the north and opened space for the British."},
{t:"Battle of Buxar",w:"Battle of Buxar",img:"Sir_Hector_Munro_by_David_Martin_(cropped).jpg",y:1764,e:1765,d:"1764 · Diwani granted 1765",era:"cmp",r:["East"],c:"war",k:"buxar mir qasim shuja ud daulah shah alam ii hector munro diwani treaty of allahabad east india company british bengal famine",s:"The Company defeated the combined forces of Mir Qasim, the Nawab of Awadh and the Mughal emperor.",x:"On 22 October 1764 Hector Munro's forces won at Buxar. By the Treaty of Allahabad in 1765, the emperor Shah Alam the Second granted the Company the diwani — the right to collect revenue — of Bengal, Bihar and Orissa. This turned a trading company into a ruling power. The terrible Bengal famine of 1770 followed amid harsh revenue collection."},
{t:"Ahilyabai Holkar",w:"Ahilyabai Holkar",img:"River_Narmada_from_Maheshwar_Fort.jpg",y:1725,e:1795,d:"1725–1795 · ruled 1767–1795",era:"cmp",r:["Central"],c:"per",k:"ahilyabai ahilya bai holkar indore maheshwar malwa queen women temples kashi vishwanath ghats maratha",s:"Holkar queen of Malwa, remembered for wise rule and for building temples and ghats across India.",x:"Ruling from Maheshwar on the Narmada, Ahilyabai Holkar was known for justice and good administration. She built and repaired temples, ghats, wells and rest houses from the Himalayas to the far south, including the present Kashi Vishwanath temple in Varanasi in 1780."},
{t:"Tipu Sultan",w:"Tipu Sultan",img:"TipuSultan1790.jpg",y:1751,e:1799,d:"1751–1799 · ruled from 1782",era:"cmp",r:["South"],c:"per",k:"tipu sultan tiger of mysore hyder ali anglo mysore wars srirangapatna seringapatam rockets karnataka british",s:"The 'Tiger of Mysore' who fought the British in the Anglo-Mysore Wars and used iron-cased rockets.",x:"Tipu succeeded his father Hyder Ali in 1782. Mysore's iron-cased rockets impressed the British, who later developed the Congreve rocket from captured examples. Tipu sought alliances with France and introduced new coins, a new calendar and silk farming. He died defending Srirangapatna on 4 May 1799 in the Fourth Anglo-Mysore War."},
{t:"Raja Ram Mohan Roy",w:"Ram Mohan Roy",img:"Portrait_of_Raja_Ram_Mohun_Roy,_1833.jpg",y:1772,e:1833,d:"1772–1833",era:"cmp",r:["East"],c:"per",k:"raja ram mohan roy rammohun brahmo samaj sabha sati abolition bentinck social reform reformer bengal renaissance women education",s:"Reformer often called the father of the Indian Renaissance, who campaigned against sati.",x:"Ram Mohan Roy founded the Brahmo Sabha, later the Brahmo Samaj, in 1828. He promoted modern education and women's rights and campaigned against sati, the burning of widows, which Governor-General William Bentinck banned in 1829. He died in Bristol, England, in 1833."},
{t:"Maharaja Ranjit Singh",w:"Ranjit Singh",img:"Maharaj_Ranjit_Singh.jpg",y:1780,e:1839,d:"1780–1839 · ruled from 1799",era:"cmp",r:["North", "Northwest"],c:"per",k:"maharaja ranjit singh sher e punjab lion of punjab sikh empire lahore khalsa army golden temple harmandir sahib anglo sikh wars king",s:"The 'Lion of Punjab' who built a powerful Sikh Empire from Lahore.",x:"Ranjit Singh took Lahore in 1799 and united the Sikh misls into an empire stretching from Punjab to Kashmir and Peshawar. He modernised his army with European officers and ruled with religious tolerance. He covered the Harmandir Sahib in gold, giving it the name Golden Temple. After his death in 1839, the British annexed Punjab in 1849 following two Anglo-Sikh wars."},
{t:"Rani Chennamma of Kittur",w:"Kittur Chennamma",img:"Kittur_Chenamma.jpg",y:1778,e:1829,d:"revolt of 1824",era:"cmp",r:["South"],c:"per",k:"rani chennamma kittur karnataka revolt queen women british",s:"Queen of Kittur who led an armed revolt against the British in 1824.",x:"When the East India Company refused to accept her adopted son as heir, Rani Chennamma of Kittur in Karnataka took up arms in 1824. Her forces won an early victory, killing the British collector, before she was captured; she died in prison in 1829. She is celebrated as one of the earliest rulers to fight British rule."},
{t:"Savitribai Phule",w:"Savitribai Phule",img:"Savitribai_Phule_statue,_Maharashtra_sadan,_New_Delhi.jpg",y:1831,e:1897,d:"1831–1897",era:"cmp",r:["West"],c:"per",k:"savitribai phule jyotirao jyotiba phule girls school pune bhide wada satyashodhak women education teacher reformer",s:"Pioneer of women's education who, with Jyotirao Phule, opened a school for girls in Pune in 1848.",x:"Savitribai and her husband Jyotirao Phule started one of the first schools for girls run by Indians, at Bhide Wada in Pune in 1848, facing abuse from people who opposed educating girls and lower castes. She was also a poet and worked to support widows. She died in 1897 while caring for plague patients."},
{t:"India's First Railway",w:"Bori Bunder",img:"Mumbai_-_Chhatrapati_Shivaji_Terminus_Tracks.jpg",y:1853,era:"cmp",r:["West"],c:"evt",k:"railway railways train bori bunder thane mumbai bombay dalhousie telegraph locomotive",s:"India's first passenger train ran from Bori Bunder in Bombay to Thane on 16 April 1853.",x:"Pulled by three locomotives named Sultan, Sindh and Sahib, the train covered about 34 kilometres. Under Governor-General Dalhousie, railways, the telegraph and a modern postal system spread quickly, binding the country together and later helping the national movement as well."},
{t:"Santhal Hul (Rebellion)",w:"Santal rebellion",img:"The_Santhal_Insurrection.jpg",y:1855,e:1856,d:"1855–1856",era:"cmp",r:["East"],c:"evt",k:"santhal santal hul rebellion revolt sidhu kanhu murmu jharkhand rajmahal tribal adivasi",s:"A major tribal uprising led by the brothers Sidhu and Kanhu Murmu.",x:"In June 1855 the Santhals of the Rajmahal hills rose against moneylenders, landlords and Company officials. The rebellion was put down with great force by 1856, but it led to the creation of the Santhal Parganas district. 30 June is still observed as Hul Diwas."},
{t:"The Revolt of 1857",w:"Indian Rebellion of 1857",img:"Indian_Rebellion_of_1857.jpg",y:1857,e:1858,d:"1857–1858",era:"frd",r:["North", "Central"],c:"war",k:"revolt of 1857 sepoy mutiny first war of independence mangal pandey meerut barrackpore delhi rani lakshmibai jhansi tantia tope nana sahib bahadur shah zafar begum hazrat mahal lucknow kunwar singh enfield cartridges rebellion uprising british",s:"A great uprising of soldiers and civilians against Company rule, often called India's First War of Independence.",x:"Sparked by greased cartridges for the new Enfield rifle and by deep anger at Company policies, the revolt broke out at Meerut on 10 May 1857, after Mangal Pandey had attacked British officers at Barrackpore in March. Rebels marched to Delhi and proclaimed Bahadur Shah Zafar emperor. Leaders included Rani Lakshmibai of Jhansi, Nana Sahib, Tantia Tope, Begum Hazrat Mahal of Lucknow and Kunwar Singh. The British crushed the revolt by 1858, but it brought Company rule to an end."},
{t:"Rani Lakshmibai of Jhansi",w:"Rani of Jhansi",img:"Rani_Lakshmibai_contemporary_portrait.jpg",y:1828,e:1858,d:"c. 1828–1858",era:"frd",r:["Central"],c:"per",k:"rani lakshmibai laxmibai jhansi ki rani manikarnika gwalior tantia tope 1857 doctrine of lapse queen women warrior",s:"The Rani of Jhansi, who fought the British in 1857–58 and died in battle.",x:"Born Manikarnika in Varanasi, she married the Raja of Jhansi. After his death the British annexed Jhansi under the Doctrine of Lapse. During the revolt she defended Jhansi, then joined Tantia Tope to capture Gwalior, where she died fighting in June 1858. She remains one of India's most celebrated heroes."},
{t:"Crown Rule Begins",w:"Delhi Durbar",img:"Delhi_Durbar,_1911.jpg",y:1858,e:1877,d:"1858 · Empress of India 1877",era:"frd",r:["Pan-India"],c:"evt",k:"government of india act 1858 queen victoria proclamation viceroy canning crown rule british raj empress delhi durbar",s:"After the revolt, the British Crown took over the rule of India from the East India Company.",x:"The Government of India Act of 1858 transferred power to the Crown, and Lord Canning became the first Viceroy. Queen Victoria's Proclamation promised respect for Indian rulers and religions. In 1877 she was proclaimed Empress of India at the Delhi Durbar. This period is known as the British Raj."},
{t:"Indian National Congress Founded",w:"Indian National Congress",img:"1st_INC1885.jpg",y:1885,era:"frd",r:["Pan-India"],c:"evt",k:"indian national congress inc a o hume w c bonnerjee bombay moderates dadabhai naoroji gokhale drain theory",s:"The Indian National Congress held its first session in Bombay in December 1885.",x:"Seventy-two delegates met under the presidency of W. C. Bonnerjee, with the retired official A. O. Hume as a key organiser. Early leaders such as Dadabhai Naoroji, Gopal Krishna Gokhale and Pherozeshah Mehta, known as the Moderates, petitioned for reforms. Naoroji's drain theory showed how British rule drained wealth out of India. The Congress became the main platform of the freedom movement."},
{t:"Swami Vivekananda",w:"Swami Vivekananda",img:"Swami_Vivekananda-1893-09-signed.jpg",y:1863,e:1902,d:"1863–1902 · Chicago address 1893",era:"frd",r:["East"],c:"per",k:"swami vivekananda narendranath datta chicago parliament of religions ramakrishna mission vedanta yoga national youth day spiritual religion",s:"Spiritual leader whose 1893 Chicago address introduced Vedanta and yoga to the West.",x:"Born Narendranath Datta in Calcutta in 1863, he was a disciple of Sri Ramakrishna. At the Parliament of the World's Religions in Chicago on 11 September 1893, he won over the audience with his opening words, 'Sisters and Brothers of America'. He founded the Ramakrishna Mission in 1897. His birthday, 12 January, is celebrated as National Youth Day."},
{t:"Mahatma Gandhi",w:"Mahatma Gandhi",img:"Mahatma-Gandhi,_studio,_1931.jpg",y:1869,e:1948,d:"1869–1948",era:"frd",r:["Pan-India"],c:"per",k:"mahatma gandhi mohandas karamchand bapu father of the nation satyagraha ahimsa non violence south africa champaran kheda sabarmati porbandar freedom fighter leader",s:"Mohandas Karamchand Gandhi led India's freedom struggle through non-violent satyagraha.",x:"Born in Porbandar in 1869, Gandhi developed satyagraha, or truth-force, while fighting racial discrimination in South Africa. He returned to India in 1915, and his first campaigns were at Champaran in 1917 and at Kheda and Ahmedabad in 1918. He led the Non-Cooperation Movement, the Salt March and Quit India, and worked against untouchability and for Hindu-Muslim unity. He was assassinated on 30 January 1948. His birthday, 2 October, is the International Day of Non-Violence."},
{t:"Srinivasa Ramanujan",w:"Srinivasa Ramanujan",img:"Srinivasa_Ramanujan-Add._MS_a94_version2_(cropped).jpg",y:1887,e:1920,d:"1887–1920",era:"frd",r:["South"],c:"per",k:"srinivasa ramanujan mathematician mathematics hardy cambridge partitions number theory 1729 taxicab number national mathematics day erode kumbakonam scientist genius",s:"A self-taught mathematical genius whose formulas still inspire research today.",x:"Born in Erode and raised in Kumbakonam, Ramanujan wrote to G. H. Hardy at Cambridge in 1913, and Hardy invited him to England. He made major contributions to number theory, infinite series and partitions, and was elected a Fellow of the Royal Society in 1918. The number 1729 is called the Hardy–Ramanujan number. He died in 1920, aged only 32. His birthday, 22 December, is National Mathematics Day."},
{t:"C. V. Raman",w:"C. V. Raman",img:"Sir_CV_Raman.JPG",y:1888,e:1970,d:"1888–1970 · Nobel Prize 1930",era:"frd",r:["South", "East"],c:"per",k:"c v raman chandrasekhara venkata raman raman effect nobel prize physics scattering of light national science day scientist",s:"Physicist who won the 1930 Nobel Prize for discovering the Raman Effect.",x:"Working in Calcutta, C. V. Raman discovered on 28 February 1928 that light changes its wavelength when it is scattered by molecules. He won the Nobel Prize in Physics in 1930, the first Asian to win a Nobel Prize in science. 28 February is celebrated as National Science Day in India. He later founded the Raman Research Institute in Bangalore."},
{t:"Rabindranath Tagore",w:"Rabindranath Tagore",img:"1926_Rabindrath_Tagore.jpg",y:1861,e:1941,d:"1861–1941 · Nobel Prize 1913",era:"frd",r:["East"],c:"per",k:"rabindranath tagore gurudev gitanjali nobel prize literature poet jana gana mana national anthem amar shonar bangla santiniketan visva bharati",s:"Poet, composer and educator, and the first Asian to win a Nobel Prize, in 1913.",x:"Tagore received the Nobel Prize in Literature for Gitanjali. He wrote India's national anthem, 'Jana Gana Mana', and Bangladesh's, 'Amar Shonar Bangla', founded Visva-Bharati at Santiniketan, and gave up his British knighthood in protest after the Jallianwala Bagh massacre."},
{t:"Partition of Bengal and Swadeshi",w:"Partition of Bengal (1905)",img:"Bharat_Mata_by_Abanindranath_Tagore.jpg",y:1905,e:1911,d:"1905–1911",era:"frd",r:["East"],c:"evt",k:"partition of bengal curzon swadeshi boycott vande mataram lal bal pal tilak lajpat rai bipin chandra pal extremists capital delhi 1911",s:"Lord Curzon's partition of Bengal sparked the Swadeshi movement.",x:"Announced in 1905, the partition was seen as an attempt to divide the people of Bengal. Indians responded with the Swadeshi movement — boycotting British goods and promoting Indian industries and national education. 'Vande Mataram' became a rallying cry, and leaders such as Bal Gangadhar Tilak, Lala Lajpat Rai and Bipin Chandra Pal rose to prominence. The partition was cancelled in 1911, when the capital was also moved from Calcutta to Delhi."},
{t:"Jallianwala Bagh Massacre",w:"Jallianwala Bagh massacre",img:"Jallianwala_Bagh_in_Day_light.JPG",y:1919,era:"frd",r:["North"],c:"evt",k:"jallianwala bagh massacre amritsar punjab general dyer rowlatt act baisakhi vaisakhi british",s:"British troops fired on a peaceful crowd in Amritsar, killing hundreds.",x:"On 13 April 1919, Brigadier-General Reginald Dyer ordered his troops to fire without warning on thousands of people gathered in the walled garden of Jallianwala Bagh, many of them protesting the harsh Rowlatt Act. Official figures put the dead at 379; Indian estimates were much higher. The massacre turned many Indians firmly against British rule."},
{t:"Non-Cooperation Movement",w:"Non-cooperation movement",img:"Chauri_chaura_new_photo.jpg",y:1920,e:1922,d:"1920–1922",era:"frd",r:["Pan-India"],c:"evt",k:"non cooperation movement khilafat chauri chaura boycott gandhi freedom struggle",s:"Gandhi's first nationwide mass movement, joined with the Khilafat cause.",x:"Indians boycotted British schools, courts, titles and cloth, and burned foreign goods in public bonfires. The alliance with the Khilafat movement brought Hindus and Muslims together. After a crowd set fire to a police station at Chauri Chaura in February 1922, killing 22 policemen, Gandhi called off the movement."},
{t:"B. R. Ambedkar",w:"B. R. Ambedkar",img:"Dr._Bhimrao_Ambedkar.jpg",y:1891,e:1956,d:"1891–1956",era:"frd",r:["West", "Pan-India"],c:"per",k:"b r ambedkar babasaheb bhimrao constitution drafting committee dalit mahad satyagraha poona pact annihilation of caste buddhism reformer leader jurist",s:"Jurist, economist and reformer who chaired the committee that drafted India's Constitution.",x:"Born at Mhow in 1891 into a Dalit family, Ambedkar earned doctorates from Columbia University and the London School of Economics. He led the Mahad Satyagraha in 1927 for Dalits' right to use public water, and signed the Poona Pact with Gandhi in 1932. As chairman of the Constitution's Drafting Committee, he championed equality and fundamental rights. In 1956 he embraced Buddhism with hundreds of thousands of followers, shortly before his death."},
{t:"Bhagat Singh",w:"Bhagat Singh",img:"Lahore_conspiracy_case_poster_9th_Oct_193o_jindal_sunam_12x9_copy_(cropped).jpg",y:1907,e:1931,d:"1907–1931",era:"frd",r:["North"],c:"per",k:"bhagat singh rajguru sukhdev chandrashekhar azad hsra inquilab zindabad central legislative assembly saunders lahore revolutionary martyr shaheed freedom fighter",s:"Revolutionary who became a symbol of youthful courage; he was hanged at the age of 23.",x:"A member of the Hindustan Socialist Republican Association, Bhagat Singh, with Rajguru and Sukhdev, shot the British officer J. P. Saunders in 1928 to avenge the death of Lala Lajpat Rai. In 1929 he and Batukeshwar Dutt threw harmless bombs in the Central Legislative Assembly and raised the slogan 'Inquilab Zindabad'. He was hanged with Rajguru and Sukhdev on 23 March 1931, now observed as Shaheed Diwas."},
{t:"The Salt March",w:"Salt March",img:"Marche_sel.jpg",y:1930,era:"frd",r:["West"],c:"evt",k:"salt march dandi march salt satyagraha civil disobedience movement sabarmati gujarat gandhi",s:"Gandhi's 24-day march to Dandi to break the salt law began the Civil Disobedience Movement.",x:"Setting out from Sabarmati Ashram on 12 March 1930 with 78 followers, Gandhi walked about 385 kilometres to Dandi on the Gujarat coast and made salt there on 6 April. Across India people broke the salt laws and boycotted foreign goods, and tens of thousands were arrested. The march drew the world's attention to India's freedom struggle."},
{t:"Quit India Movement",w:"Quit India Movement",img:"Quit_India_Movement_2017_stampsheet_2.jpg",y:1942,era:"frd",r:["Pan-India"],c:"evt",k:"quit india movement august kranti do or die gowalia tank bombay aruna asaf ali gandhi freedom struggle",s:"Gandhi's call for the British to 'Quit India', with the slogan 'Do or Die'.",x:"On 8 August 1942 the Congress, meeting in Bombay, passed the Quit India resolution. Gandhi and other leaders were arrested the next morning, but people across India carried on with strikes and protests, and parallel governments were set up in places such as Satara, Tamluk and Ballia. Aruna Asaf Ali hoisted the flag at Gowalia Tank. The movement was suppressed, but it showed that British rule could not last much longer."},
{t:"Subhas Chandra Bose and the INA",w:"Subhas Chandra Bose",img:"Subhas_Chandra_Bose_NRB.jpg",y:1897,e:1945,d:"1897–1945 · Azad Hind 1943",era:"frd",r:["Pan-India", "Northeast"],c:"per",k:"subhas chandra bose netaji azad hind fauj ina indian national army forward bloc jai hind dilli chalo provisional government imphal kohima freedom fighter leader",s:"Netaji Subhas Chandra Bose led the Azad Hind Fauj, the Indian National Army, to fight for freedom.",x:"Twice president of the Congress, Bose escaped house arrest in 1941 and sought help from Germany and Japan. In South-East Asia he took command of the Indian National Army, and in October 1943 he proclaimed the Provisional Government of Free India, Azad Hind. The INA fought alongside Japan in the Imphal and Kohima campaign. After the war, the INA trials at the Red Fort stirred the nation. His slogans 'Jai Hind' and 'Dilli Chalo' are still famous."},
{t:"Independence and Partition",w:"Partition of India",img:"Brit_IndianEmpireReligions3.jpg",y:1947,era:"rep",r:["Pan-India"],c:"evt",k:"independence day 15 august 1947 freedom partition pakistan mountbatten nehru tryst with destiny radcliffe line refugees",s:"India became independent on 15 August 1947, amid the tragedy of Partition.",x:"The Indian Independence Act divided British India into India and Pakistan. Jawaharlal Nehru became the first Prime Minister and gave his 'Tryst with Destiny' speech at midnight. The Radcliffe Line split Punjab and Bengal; between 10 and 20 million people were uprooted, and hundreds of thousands, perhaps up to two million, were killed in communal violence. Lord Mountbatten stayed on as Governor-General until 1948 and was followed by C. Rajagopalachari."},
{t:"Integration of the Princely States",w:"Vallabhbhai Patel",img:"Statue_of_Unity.jpg",y:1947,e:1949,d:"1947–1949",era:"rep",r:["Pan-India"],c:"evt",k:"sardar vallabhbhai patel v p menon princely states instrument of accession hyderabad junagadh kashmir operation polo iron man of india statue of unity",s:"Sardar Patel and V. P. Menon brought over 560 princely states into the Indian Union.",x:"Most rulers signed Instruments of Accession by August 1947. Jammu and Kashmir acceded in October 1947, Junagadh joined after a vote in 1948, and Hyderabad after a police action called Operation Polo in September 1948. Sardar Vallabhbhai Patel, the Iron Man of India, is honoured by the Statue of Unity in Gujarat, the tallest statue in the world."},
{t:"Jawaharlal Nehru",w:"Jawaharlal Nehru",img:"Nehru_in_the_Netherlands,_1957.jpg",y:1889,e:1964,d:"1889–1964 · Prime Minister 1947–1964",era:"rep",r:["Pan-India"],c:"per",k:"jawaharlal nehru chacha nehru first prime minister discovery of india non aligned movement iit aiims five year plans childrens day leader",s:"India's first Prime Minister, who built many of its democratic and scientific institutions.",x:"A leading figure of the freedom movement and author of The Discovery of India, Nehru led the country for seventeen years. He launched the Five-Year Plans, founded institutions such as the IITs and AIIMS, and with leaders like Nasser and Tito helped found the Non-Aligned Movement. His birthday, 14 November, is celebrated as Children's Day."},
{t:"The Constitution and the Republic",w:"Constitution of India",img:"Constitution_of_India.jpg",y:1949,e:1950,d:"adopted 26 Nov 1949 · in force 26 Jan 1950",era:"rep",r:["Pan-India"],c:"evt",k:"constitution of india republic day 26 january constituent assembly rajendra prasad ambedkar preamble fundamental rights constitution day democracy",s:"The Constitution was adopted on 26 November 1949, and India became a republic on 26 January 1950.",x:"The Constituent Assembly, presided over by Dr Rajendra Prasad, worked for nearly three years, with Dr B. R. Ambedkar chairing the Drafting Committee. The Constitution guarantees fundamental rights and sets up a parliamentary democracy with a federal structure. 26 January was chosen to honour the Purna Swaraj declaration of 1930. Rajendra Prasad became the first President of India."},
{t:"First General Election",w:"1951–52 Indian general election",img:"Shri_Jawaharlal_Nehru.jpg",y:1951,e:1952,d:"Oct 1951 – Feb 1952",era:"rep",r:["Pan-India"],c:"evt",k:"first general election universal adult franchise voting sukumar sen election commission ballot democracy",s:"The largest election the world had seen, held with the vote for every adult.",x:"Conducted under Chief Election Commissioner Sukumar Sen, it registered about 173 million voters, most of whom could not read, so parties were identified by symbols. The Congress, led by Nehru, won a large majority."},
{t:"Reorganisation of States",w:"States Reorganisation Act, 1956",img:"Potti_sriramulu_statue.jpg",y:1956,e:1960,d:"1953–1960",era:"rep",r:["Pan-India"],c:"evt",k:"states reorganisation act linguistic states potti sriramulu andhra fazl ali commission maharashtra gujarat",s:"India's states were redrawn largely along language lines.",x:"After Potti Sriramulu died while fasting for a Telugu-speaking state in 1952, Andhra State was formed in 1953. The States Reorganisation Act of 1956 created 14 states and 6 union territories. More states followed, such as Maharashtra and Gujarat in 1960."},
{t:"Liberation of Goa",w:"Annexation of Goa",img:"NRP_Afonso_de_Albuquerque.jpg",y:1961,era:"rep",r:["West"],c:"evt",k:"goa liberation operation vijay portuguese daman diu",s:"Indian forces ended about 450 years of Portuguese rule in Goa, Daman and Diu.",x:"After years of failed talks, Operation Vijay began on 18 December 1961, and the Portuguese governor surrendered on 19 December, now marked as Goa Liberation Day. Goa became a full state in 1987."},
{t:"The Green Revolution",w:"Green Revolution in India",img:"Punjab_Monsoon.jpg",y:1965,e:1975,d:"mid-1960s onward",era:"rep",r:["North", "Pan-India"],c:"sci",k:"green revolution m s swaminathan norman borlaug high yielding varieties wheat punjab haryana food security agriculture white revolution operation flood verghese kurien milk",s:"New high-yielding seeds, irrigation and fertilisers made India self-sufficient in food grains.",x:"In the mid-1960s, scientists led by M. S. Swaminathan worked with Norman Borlaug's high-yielding wheat varieties, and Agriculture Minister C. Subramaniam pushed for their use. Wheat harvests soared, especially in Punjab, Haryana and western Uttar Pradesh, ending India's dependence on food imports, though it also raised concerns about soil, water and inequality. Verghese Kurien's Operation Flood, launched in 1970, later made India the world's largest milk producer — the White Revolution."},
{t:"India's Space Programme",w:"Chandrayaan-3",img:"LVM3_M4,_Chandrayaan-3_-_Launch_vehicle_lifting_off_from_the_Second_Launch_Pad_(SLP)_of_SDSC-SHAR,_Sriharikota_(edit).jpg",y:1969,e:2023,d:"ISRO founded 1969 · Moon landing 2023",era:"rep",r:["Pan-India", "South"],c:"sci",k:"isro space programme vikram sarabhai thumba aryabhata satellite rohini slv apj abdul kalam chandrayaan mangalyaan mars orbiter mission moon landing national space day rocket science",s:"From rockets assembled near a church in Thumba to a landing near the Moon's south pole.",x:"ISRO was founded in 1969 under the vision of Vikram Sarabhai; India's first rockets had been launched from Thumba near Thiruvananthapuram from 1963, with parts famously carried on bicycles. India's first satellite, Aryabhata, went up in 1975, and in 1980 the SLV-3, with A. P. J. Abdul Kalam as project director, placed Rohini in orbit. Chandrayaan-1 in 2008 helped detect water on the Moon, Mangalyaan reached Mars orbit in 2014 on its first attempt, and Chandrayaan-3 landed near the lunar south pole on 23 August 2023, now celebrated as National Space Day."},
{t:"The 1971 War and Bangladesh",w:"Indo-Pakistani war of 1971",img:"1971_Instrument_of_Surrender.jpg",y:1971,era:"rep",r:["East"],c:"war",k:"1971 war bangladesh liberation indira gandhi sam manekshaw pakistan surrender dhaka vijay diwas",s:"India's victory in the 1971 war led to the creation of Bangladesh.",x:"A brutal military crackdown in East Pakistan drove around ten million refugees into India. War broke out on 3 December 1971, and on 16 December about 93,000 Pakistani troops surrendered in Dhaka — one of the largest surrenders since the Second World War. 16 December is observed as Vijay Diwas. Sam Manekshaw led the Indian Army, and Indira Gandhi was Prime Minister."},
{t:"Pokhran Nuclear Tests",w:"Pokhran-II",img:"Trombay.jpg",y:1974,e:1998,d:"1974 and 1998",era:"rep",r:["West"],c:"sci",k:"pokhran nuclear test smiling buddha operation shakti homi bhabha national technology day rajasthan atomic",s:"India carried out nuclear tests at Pokhran in Rajasthan in 1974 and 1998.",x:"The test code-named Smiling Buddha, on 18 May 1974, was India's first. The Pokhran-II tests, called Operation Shakti, in May 1998 led India to declare itself a nuclear weapons state. India's nuclear programme was founded by the physicist Homi J. Bhabha. 11 May is observed as National Technology Day."},
{t:"The Emergency",w:"The Emergency (India)",img:"Jayaprakash_Narayan_2001_stamp_of_India.jpg",y:1975,e:1977,d:"June 1975 – March 1977",era:"rep",r:["Pan-India"],c:"evt",k:"emergency 1975 indira gandhi article 352 janata party morarji desai press censorship",s:"A 21-month period of emergency rule during which many civil liberties were suspended.",x:"Declared on 25 June 1975, soon after the Allahabad High Court set aside Indira Gandhi's election, the Emergency suspended many fundamental rights, censored the press and jailed opposition leaders. In the elections of March 1977 the Janata Party won, and Morarji Desai became Prime Minister. Later constitutional amendments made it harder to impose such an emergency."},
{t:"Economic Liberalisation",w:"Economic liberalisation in India",img:"Visit_of_Narasimha_Rao,_Indian_Minister_for_Foreign_Affairs,_to_the_CEC_(cropped).jpg",y:1991,era:"rep",r:["Pan-India"],c:"evt",k:"liberalisation liberalization 1991 economic reforms lpg manmohan singh p v narasimha rao privatisation globalisation economy",s:"Economic reforms that opened up India's economy after a severe financial crisis.",x:"Facing a foreign-exchange crisis in 1991, the government of P. V. Narasimha Rao, with Finance Minister Manmohan Singh, removed many licensing controls, lowered import duties, devalued the rupee and welcomed foreign investment. The reforms brought faster growth and the rise of industries such as information technology and telecom."},
{t:"Chandragupta Maurya",w:"Chandragupta Maurya",img:"Chandragupt_maurya_Birla_mandir_6_dec_2009_(31)_(cropped).JPG",y:-322,e:-298,d:"c. 350–295 BCE · reigned c. 322–298 BCE",era:"emp",r:["North", "East"],c:"per",k:"chandragupta maurya founder maurya empire pataliputra chanakya nanda dhana nanda seleucus megasthenes jain shravanabelagola bhadrabahu",s:"Founder of the Maurya Empire, who overthrew the Nandas with Chanakya's help and united most of north India.",x:"Guided by his teacher Chanakya, Chandragupta Maurya overthrew the Nanda king Dhana Nanda around 322 BCE and made Pataliputra his capital. He drove out the Greek garrisons left behind by Alexander, and in about 305 BCE defeated Seleucus Nicator, who ceded territories in the north-west and sent the ambassador Megasthenes to his court. His empire stretched from Afghanistan to Bengal and into the Deccan. According to Jain tradition, he gave up his throne late in life, became a disciple of the monk Bhadrabahu and ended his days at Shravanabelagola in Karnataka. His son Bindusara and grandson Ashoka continued his work."},
{t:"Samudragupta",w:"Samudragupta",img:"SamudraguptaCoin.png",y:335,e:375,d:"reigned c. 335–375 CE",era:"cls",r:["North"],c:"per",k:"samudragupta gupta emperor napoleon of india allahabad prayag pillar harisena prashasti veena coins ashvamedha conquests kumaradevi",s:"The Gupta emperor whose sweeping conquests, recorded on the Allahabad pillar, earned him the title 'Napoleon of India'.",x:"Son of Chandragupta I and the Lichchhavi princess Kumaradevi, Samudragupta expanded the Gupta Empire across the Ganga plain and led a famous campaign into the south, where he defeated many kings but returned their kingdoms to them as tributaries. His court poet Harisena recorded these deeds in a long Sanskrit praise poem carved on the Ashokan pillar at Allahabad (Prayagraj). He performed the ashvamedha horse sacrifice, and his gold coins show him playing the veena, suggesting a love of music and poetry. The historian V. A. Smith called him the 'Napoleon of India'. His son Chandragupta II carried the empire to its height."},
{t:"The Epics: Ramayana and Mahabharata",w:"Mahabharata",img:"Kurukshetra.jpg",y:-400,e:400,d:"composed c. 400 BCE – 400 CE",era:"emp",r:["Pan-India"],c:"rel",k:"ramayana mahabharata epics epic valmiki vyasa bhagavad gita kurukshetra rama sita ravana krishna arjuna pandavas kauravas itihasa kamban",s:"India's two great Sanskrit epics, the Ramayana of Valmiki and the Mahabharata of Vyasa, which includes the Bhagavad Gita.",x:"The Ramayana, attributed to the sage Valmiki, tells the story of Prince Rama of Ayodhya, his exile, the abduction of Sita by Ravana and her rescue. The Mahabharata, attributed to Vyasa and one of the longest poems in the world, tells of the struggle between the Pandavas and the Kauravas that ends in the war of Kurukshetra; within it is the Bhagavad Gita, Krishna's teaching to Arjuna. Both were composed and expanded over many centuries, roughly between 400 BCE and 400 CE, and have been retold in every Indian language, such as Kamban's Tamil Ramayana and Tulsidas's Ramcharitmanas. Indian tradition calls them itihasa — 'thus it happened'."},
{t:"Indian Classical Dance",w:"Indian classical dance",img:"Bharata_Natyam_Performance_DS.jpg",y:-200,e:2000,d:"rooted in the Natyashastra (c. 200 BCE – 200 CE)",era:"emp",r:["Pan-India"],c:"art",k:"classical dance dances bharatanatyam kathak kathakali kuchipudi odissi manipuri mohiniyattam sattriya natyashastra eight sangeet natak akademi rukmini devi kalamandalam",s:"India has eight dance forms recognised as classical, all tracing their roots to the ancient Natyashastra.",x:"Indian classical dance grows from the principles of the Natyashastra, the ancient treatise attributed to Bharata Muni. The Sangeet Natak Akademi recognises eight classical forms: Bharatanatyam from Tamil Nadu, Kathak from north India, Kathakali and Mohiniyattam from Kerala, Kuchipudi from Andhra Pradesh, Odissi from Odisha, Manipuri from Manipur and Sattriya from Assam. Many were preserved in temples and royal courts, and several were revived in the 20th century by artists such as Rukmini Devi Arundale, who championed Bharatanatyam, and the poet Vallathol Narayana Menon, who founded the Kerala Kalamandalam."},
{t:"Dholavira",w:"Dholavira",img:"DHOLAVIRA_SITE_(24).jpg",y:-3000,e:-1500,d:"c. 3000–1500 BCE",era:"har",r:["West"],c:"dyn",k:"dholavira harappan city kutch gujarat khadir bet water reservoirs signboard indus script unesco 2021 bisht",s:"A great Harappan city in the Rann of Kutch, famous for its water reservoirs and an ancient 'signboard', made a UNESCO World Heritage Site in 2021.",x:"Dholavira, on Khadir Bet island in the Great Rann of Kutch in Gujarat, was one of the five largest Harappan cities. Excavated by R. S. Bisht of the Archaeological Survey of India from 1990, it had a citadel, a middle town and a lower town, and an extraordinary system of stone reservoirs and channels to store rainwater in a dry land. Archaeologists found a large inscription of ten Indus signs, possibly a signboard over a gateway. Dholavira became India's 40th World Heritage Site in 2021."},
{t:"Pandya Dynasty",w:"Pandya dynasty",img:"Massa_coin_of_the_Pandyas.jpg",y:1190,e:1345,d:"ancient origins · imperial peak c. 1190–1311",era:"emd",r:["South"],c:"dyn",k:"pandya pandyan madurai pearl korkai jatavarman sundara pandya marco polo tamil nadu sangam malik kafur",s:"The ancient Tamil dynasty of Madurai, famous for pearls and trade, which became the leading power of the south in the 13th century.",x:"The Pandyas are among the oldest ruling families of India: they are mentioned by Megasthenes, in Ashoka's edicts and in Sangam poetry, and their port of Korkai was famous for pearls. After centuries in the shadow of the Pallavas and Cholas, they rose again in the late 12th century. Under Jatavarman Sundara Pandya in the mid-13th century they defeated the Cholas and Hoysalas and controlled much of Tamil Nadu and parts of Sri Lanka. Marco Polo, who visited in the 1290s, described the wealth of the Pandya coast. Their power collapsed after the raids of Alauddin Khalji's general Malik Kafur in 1311, and a short-lived Madurai Sultanate followed."},
{t:"Amir Khusrau",w:"Amir Khusrau",img:"Amir_Khusro.jpg",y:1253,e:1325,d:"1253–1325",era:"sul",r:["North"],c:"per",k:"amir khusrau khusro poet musician sufi nizamuddin auliya qawwali tuti e hind parrot of india hindavi persian riddles",s:"Poet, musician and scholar of the Delhi Sultanate, called the 'Parrot of India', who shaped qawwali and wrote in Persian and Hindavi.",x:"Amir Khusrau served as a court poet to several sultans of Delhi, including Alauddin Khalji, and was a devoted disciple of the Sufi saint Nizamuddin Auliya, near whose tomb he is buried in Delhi. He wrote in Persian and in Hindavi, an early form of Hindi-Urdu, and his riddles and songs are still popular. He is credited with developing qawwali, the devotional music of the Sufis, and tradition also links him with new musical forms and instruments, though historians debate some of these claims. He was given the title Tuti-e-Hind, the Parrot of India."},
{t:"Kabir",w:"Kabir",img:"Kabir004.jpg",y:1440,e:1518,d:"c. 15th century (traditionally 1440–1518)",era:"sul",r:["North"],c:"rel",k:"kabir sant kabir das bhakti saint poet weaver varanasi kashi doha dohe bijak guru granth sahib ramananda nirguna",s:"Bhakti saint-poet and weaver of Varanasi whose simple couplets rejected caste and empty ritual and spoke of one God for all.",x:"Kabir grew up in a family of Muslim weavers in Varanasi and is traditionally described as a disciple of the saint Ramananda. In short, sharp couplets called dohas, composed in the everyday language of the people, he mocked empty rituals and caste pride among both Hindus and Muslims, and taught devotion to a formless God. His verses are collected in the Bijak, and many are included in the Sikh holy book, the Guru Granth Sahib. Both Hindus and Muslims claimed him as their own, and the Kabir Panth continues his teachings."},
{t:"Mirabai",w:"Meera",img:"Kangra_painting_of_Mirabai,_the_female_Bhakti_saint.jpg",y:1498,e:1547,d:"c. 1498 – c. 1547",era:"sul",r:["West"],c:"rel",k:"mirabai meera meera bai saint poet bhakti krishna rajput princess mewar chittor merta bhajans women dwarka",s:"Rajput princess and Bhakti poet whose songs of devotion to Krishna are still sung across India.",x:"Born into the Rathore royal family of Merta in Rajasthan, Mirabai was married into the royal house of Mewar at Chittor. Devoted to Krishna from childhood, she refused to follow many customs expected of a royal widow, and tradition tells of attempts by her in-laws to harm her. She left the palace to live among saints and pilgrims, eventually reaching Dwarka. Her hundreds of bhajans, composed in Rajasthani and Braj, made her one of the most loved voices of the Bhakti movement."},
{t:"Krishnadevaraya",w:"Krishnadevaraya",img:"Chinnadevi,_Krishnadevaraya,_Tirumaladevi_statues_at_Chandragiri_Museum.jpg",y:1509,e:1529,d:"reigned 1509–1529",era:"sul",r:["South"],c:"per",k:"krishnadevaraya krishna deva raya vijayanagara tuluva hampi ashtadiggajas tenali rama amuktamalyada telugu raichur domingo paes",s:"The greatest king of Vijayanagara — a successful general and a poet whose court was famed for its scholars.",x:"Krishnadevaraya of the Tuluva dynasty ruled Vijayanagara at its height. He captured Raichur from Bijapur in 1520 and campaigned successfully against the Gajapati kings of Odisha. A patron of art and learning, he wrote the Telugu poem Amuktamalyada and kept eight great poets at his court, known as the Ashtadiggajas; the witty Tenali Rama is linked with his court in popular stories. He built and enlarged many temples at Hampi. Portuguese visitors such as Domingo Paes left admiring descriptions of his capital."},
{t:"Babur",w:"Babur",img:"Humayun_and_Babur_(Late_Shah_Jahan_Album)_Babur_detail.jpg",y:1526,e:1530,d:"1483–1530 · emperor 1526–1530",era:"mug",r:["North"],c:"per",k:"babur zahiruddin muhammad founder mughal empire timur genghis khan fergana kabul panipat khanwa baburnama gardens",s:"Founder of the Mughal Empire, a descendant of Timur and Genghis Khan, who won the First Battle of Panipat in 1526.",x:"Born in Fergana in Central Asia in 1483, Babur lost his homeland as a young man and made Kabul his base in 1504. After several raids into India, he defeated Ibrahim Lodi at Panipat in 1526 using field guns and cavalry tactics, and the next year beat Rana Sanga of Mewar at Khanwa. He died in Agra in 1530, only four years after founding the empire, and was later buried in Kabul. His memoir, the Baburnama, written in Chagatai Turkish, is famous for its honest and vivid descriptions of people, plants and places."},
{t:"Rani Durgavati",w:"Rani Durgavati",img:"Death_of_Rani_Durgavati,_ruler_of_Garha_Katanga,_at_the_Battle_of_Narrai_(1564).jpg",y:1550,e:1564,d:"1524–1564 · ruled Garha-Katanga from c. 1550",era:"mug",r:["Central"],c:"per",k:"rani durgavati gond queen gondwana garha katanga mandla chandela jabalpur asaf khan akbar narrai women warrior",s:"Gond queen of Garha-Katanga who fought the Mughal army and chose death over surrender in 1564.",x:"Born a Chandela princess, Durgavati married into the Gond royal family of Garha-Katanga in present-day Madhya Pradesh and ruled as regent for her young son after her husband's death. She governed well, built reservoirs and defended her kingdom against the Sultan of Malwa. In 1564 Akbar's general Asaf Khan invaded. Durgavati led her troops in battle near Narrai and, badly wounded and facing capture, took her own life. Her martyrdom day, 24 June, is remembered in Madhya Pradesh, and a university in Jabalpur bears her name."},
{t:"Maharana Pratap",w:"Maharana Pratap",img:"Maharana_Pratap_By_Surendra_Singh_Shaktawat.jpg",y:1572,e:1597,d:"1540–1597 · ruled Mewar from 1572",era:"mug",r:["West"],c:"per",k:"maharana pratap rana pratap singh mewar sisodia rajput udaipur haldighati chetak akbar chavand bhamashah",s:"Rajput ruler of Mewar who refused to submit to Akbar and fought on from the hills after the Battle of Haldighati.",x:"Pratap Singh of the Sisodia clan became ruler of Mewar in 1572, at a time when many Rajput kingdoms had allied with the Mughals. He refused to accept Akbar's overlordship, and in 1576 faced the Mughal army led by Raja Man Singh at Haldighati. Though the battle went against him, he escaped on his horse Chetak and continued a long struggle from the Aravalli hills, helped by the Bhil people and the minister Bhamashah. By his death at Chavand in 1597 he had recovered much of Mewar. He is remembered as a symbol of courage and independence."},
{t:"Tansen",w:"Tansen",img:"Tansen_of_Gwalior._(11.8x6.7cm)_Mughal._1585-90._National_Museum,_New_Delhi..jpg",y:1562,e:1589,d:"c. 1500–1589 · at Akbar's court from 1562",era:"mug",r:["Central", "North"],c:"art",k:"tansen mian tansen musician hindustani classical music akbar navratnas nine jewels gwalior raga deepak darbari kanada megh malhar swami haridas dhrupad",s:"Legendary musician of Akbar's court, one of the greatest figures of Hindustani classical music.",x:"Born near Gwalior, Tansen trained in the dhrupad style, traditionally under the saint-musician Swami Haridas, and served Raja Ramchandra of Rewa before Akbar summoned him to the Mughal court in 1562. Counted among Akbar's 'nine jewels', he is credited with creating ragas such as Darbari Kanada and Miyan ki Malhar. Legends say his singing of Raga Deepak could light lamps and Megh Malhar could bring rain. His tomb is in Gwalior, where a famous music festival is held in his honour every year."},
{t:"Jahangir",w:"Jahangir",img:"Jahangircrop.jpeg",y:1605,e:1627,d:"reigned 1605–1627",era:"mug",r:["North"],c:"per",k:"jahangir salim mughal emperor nur jahan chain of justice thomas roe miniature painting mansur tuzuk i jahangiri guru arjan shalimar",s:"Mughal emperor famous for his love of painting and nature, his 'chain of justice' and the power of his empress Nur Jahan.",x:"Akbar's son Salim took the name Jahangir, 'conqueror of the world', when he became emperor in 1605. He is said to have hung a golden chain of justice that anyone could pull to seek his attention. Under him Mughal miniature painting reached great heights, with artists such as Ustad Mansur painting birds and animals in fine detail. His wife Nur Jahan was so influential that coins were issued in her name. He allowed the English to trade after the embassy of Sir Thomas Roe in 1615 and wrote his memoirs, the Tuzuk-i-Jahangiri. His reign also saw the execution of the fifth Sikh Guru, Guru Arjan, in 1606."},
{t:"Shah Jahan",w:"Shah Jahan",img:"'Jujhar_Singh_Bundela_Kneels_in_Submission_to_Shah_Jahan',_painted_by_Bichitr,_c._1630,_Chester_Beatty_Library_(cropped2).jpg",y:1628,e:1658,d:"reigned 1628–1658",era:"mug",r:["North"],c:"per",k:"shah jahan khurram mughal emperor taj mahal mumtaz mahal red fort shahjahanabad jama masjid peacock throne agra fort architecture samugarh",s:"Mughal emperor of the golden age of Mughal architecture, who built the Taj Mahal, the Red Fort and Shahjahanabad.",x:"Prince Khurram became emperor as Shah Jahan in 1628. His reign was a time of great wealth and magnificent building: the Taj Mahal in memory of his wife Mumtaz Mahal, the new capital Shahjahanabad in Delhi with its Red Fort and Jama Masjid, and the jewelled Peacock Throne. In 1657 he fell ill and his sons fought a war of succession; the winner, Aurangzeb, kept him confined in Agra Fort from 1658 until his death in 1666, where tradition says he gazed at the Taj Mahal across the river."},
{t:"Golden Temple",w:"Golden Temple",img:"The_Golden_Temple_of_Amrithsar_7.jpg",y:1604,e:1830,d:"completed 1604 · gilded under Ranjit Singh",era:"mug",r:["North"],c:"art",k:"golden temple harmandir sahib darbar sahib amritsar sikh guru arjan guru ram das adi granth 1604 akal takht ranjit singh gold langar sarovar",s:"The Harmandir Sahib in Amritsar, the holiest gurdwara of the Sikhs, covered in gold by Maharaja Ranjit Singh.",x:"The fourth Sikh Guru, Guru Ram Das, founded the town of Amritsar around its sacred pool. His successor, Guru Arjan, built the Harmandir Sahib in the middle of the pool, with doors on all four sides to welcome people of every background, and installed the newly compiled Adi Granth there in 1604. Damaged several times in the 18th century, it was rebuilt, and in the early 19th century Maharaja Ranjit Singh covered its upper storeys in gold, giving it the name Golden Temple. Its langar, the community kitchen, serves free meals to tens of thousands of people every day."},
{t:"Meenakshi Temple",w:"Meenakshi Temple",img:"An_aerial_view_of_Madurai_city_from_atop_of_Meenakshi_Amman_temple.jpg",y:1600,e:1700,d:"rebuilt mainly in the 16th–17th centuries",era:"mug",r:["South"],c:"art",k:"meenakshi temple madurai meenakshi amman sundareswarar gopurams gopuram nayaka thirumalai nayak tamil nadu dravidian architecture thousand pillared hall",s:"The great temple of Madurai, with its towering, brightly painted gopurams, dedicated to the goddess Meenakshi and Lord Sundareswarar.",x:"Madurai has been a temple city since the days of the Pandyas, and the shrine of the goddess Meenakshi and her consort Sundareswarar (Shiva) stands at its heart. Much of the present complex was built by the Nayaka rulers of Madurai in the 16th and 17th centuries, especially Thirumalai Nayak. It has fourteen gopurams (gateway towers), the tallest about 52 metres high, covered with thousands of colourful sculptures, as well as a Hall of a Thousand Pillars and a sacred tank. It is one of the finest examples of Dravidian architecture."},
{t:"Lachit Borphukan",w:"Lachit Borphukan",img:"Lachit_Borphukan_Statue.jpg",y:1622,e:1672,d:"1622–1672",era:"mug",r:["Northeast"],c:"per",k:"lachit borphukan ahom general saraighat brahmaputra mughal ram singh assam guwahati lachit divas nda gold medal",s:"Ahom general who defeated a much larger Mughal force at the Battle of Saraighat on the Brahmaputra in 1671.",x:"Lachit Borphukan was a commander of the Ahom army of Assam. After the Mughals occupied Guwahati, he recaptured it in 1667, and when a huge Mughal army under Raja Ram Singh of Amber returned, he used the river, hills and fortifications to wear it down. At the decisive naval Battle of Saraighat in 1671, though ill, he led the Ahom boats to victory on the Brahmaputra, ending Mughal attempts to conquer Assam. He died the following year. His birth anniversary, 24 November, is celebrated as Lachit Divas, and the best cadet of the National Defence Academy receives the Lachit Borphukan Gold Medal."},
{t:"Baji Rao I",w:"Baji Rao I",img:"Bajirao_I_painting.jpg",y:1720,e:1740,d:"1700–1740 · Peshwa 1720–1740",era:"mug",r:["West", "Central"],c:"per",k:"baji rao i bajirao peshwa maratha shahu palkhed delhi raid malwa bundelkhand chhatrasal mastani pune cavalry",s:"The Maratha Peshwa who never lost a battle and carried Maratha power from the Deccan into north India.",x:"Appointed Peshwa by Chhatrapati Shahu in 1720 at about the age of twenty, Baji Rao I became one of India's most brilliant cavalry generals. His swift campaigns brought Malwa, Gujarat and Bundelkhand under Maratha influence; he defeated the Nizam of Hyderabad at Palkhed in 1728 and at Bhopal in 1738, and in 1737 made a lightning raid to the outskirts of Delhi. He helped the Bundela king Chhatrasal against the Mughals. He died suddenly in 1740 on the banks of the Narmada, but the power he built dominated much of India for the next half-century."},
{t:"Velu Nachiyar",w:"Velu Nachiyar",img:"Velu_Nachchiyar_2008_stamp_of_India.jpg",y:1780,e:1796,d:"1730–1796 · recaptured Sivaganga in 1780",era:"cmp",r:["South"],c:"per",k:"velu nachiyar rani sivaganga queen tamil nadu kuyili hyder ali east india company veeramangai women warrior",s:"Queen of Sivaganga who fought the East India Company and won back her kingdom in 1780.",x:"Velu Nachiyar, a princess of Ramanathapuram, became queen of Sivaganga in Tamil Nadu. When her husband was killed in 1772 by the forces of the Nawab of Arcot and the East India Company, she escaped and gathered support, including help from Hyder Ali of Mysore. In 1780 she attacked and recaptured Sivaganga; tradition credits her commander Kuyili with a daring attack on a British ammunition store. She is remembered in Tamil Nadu as Veeramangai, 'the brave woman', and is one of the earliest Indian rulers to fight the British."},
{t:"Ishwar Chandra Vidyasagar",w:"Ishwar Chandra Vidyasagar",img:"Ishwarchandra_Vidyasagar.jpg",y:1820,e:1891,d:"1820–1891",era:"cmp",r:["East"],c:"per",k:"ishwar chandra vidyasagar bengal renaissance widow remarriage act 1856 girls schools barnaparichay bengali alphabet sanskrit college reformer",s:"Bengali scholar and reformer who campaigned for widow remarriage and girls' education and simplified the Bengali alphabet.",x:"Born into a poor family in Bengal, Ishwar Chandra earned the title Vidyasagar, 'ocean of learning', for his brilliance in Sanskrit, and became principal of the Sanskrit College in Calcutta. He fought tirelessly for the rights of widows, and his campaign led to the Hindu Widows' Remarriage Act of 1856. He also opposed child marriage and polygamy, helped set up dozens of schools for girls, and wrote Barnaparichay, the primer that taught generations of children to read Bengali. He was known for his simple living and great generosity."},
{t:"Dayananda Saraswati",w:"Dayananda Saraswati",img:"Dayananda_Saraswati.jpg",y:1824,e:1883,d:"1824–1883 · founded the Arya Samaj in 1875",era:"cmp",r:["North", "West"],c:"rel",k:"swami dayananda saraswati arya samaj 1875 bombay satyarth prakash back to the vedas dav schools tankara gujarat mool shankar reformer",s:"Founder of the Arya Samaj, who called on Indians to go 'back to the Vedas' and opposed idol worship and caste discrimination.",x:"Born Mool Shankar at Tankara in Gujarat, Dayananda left home as a young man in search of truth and became a sannyasi. He founded the Arya Samaj in Bombay in 1875 and set out his ideas in the book Satyarth Prakash. He taught that the Vedas were the true source of knowledge, opposed idol worship, child marriage and untouchability, and supported education for women. His followers later founded the Dayanand Anglo-Vedic (DAV) schools and colleges, and the Arya Samaj had a strong influence in Punjab and north India."},
{t:"Sir Syed Ahmad Khan",w:"Syed Ahmad Khan",img:"Syed_Ahmad_Khan_1907.jpg",y:1817,e:1898,d:"1817–1898",era:"cmp",r:["North"],c:"per",k:"sir syed ahmad khan aligarh movement muhammadan anglo oriental college 1875 aligarh muslim university scientific society modern education reformer",s:"Reformer who founded the college that became Aligarh Muslim University, promoting modern scientific education among Muslims.",x:"Sir Syed Ahmad Khan worked as a judicial officer under the British and lived through the upheaval of 1857, after which he wrote about its causes. Convinced that Indian Muslims needed modern education, he founded the Scientific Society to translate Western works into Urdu and, in 1875, the Muhammadan Anglo-Oriental College at Aligarh, which became Aligarh Muslim University in 1920. His ideas, known as the Aligarh Movement, combined faith with reason and science and shaped generations of leaders."},
{t:"Raja Ravi Varma",w:"Raja Ravi Varma",img:"Raja_Ravi_Varma_-_Mahabharata_-_Shakuntala.jpg",y:1848,e:1906,d:"1848–1906",era:"cmp",r:["South"],c:"art",k:"raja ravi varma painter kilimanoor travancore oil painting gods goddesses lithographic press shakuntala damayanti indian art",s:"Painter from Kerala who combined Indian themes with European oil-painting techniques and made pictures of gods and epic heroines popular across India.",x:"Born at Kilimanoor in the princely state of Travancore in 1848, Raja Ravi Varma became one of India's most celebrated painters. He mastered European oil painting and used it to depict scenes from the Ramayana, the Mahabharata and Sanskrit literature, such as Shakuntala and Damayanti, as well as portraits. In 1894 he set up a lithographic press near Bombay that printed affordable copies of his paintings, bringing art into ordinary homes across India."},
{t:"Dadabhai Naoroji",w:"Dadabhai Naoroji",img:"Dadabhai_Naoroji_1889.jpg",y:1825,e:1917,d:"1825–1917",era:"cmp",r:["West"],c:"per",k:"dadabhai naoroji grand old man of india drain theory poverty and un british rule congress president british parliament finsbury first indian mp",s:"The 'Grand Old Man of India', whose drain theory exposed how British rule took wealth out of India, and the first Indian elected to the British Parliament.",x:"A Parsi scholar from Bombay, Dadabhai Naoroji taught mathematics before turning to public life. He helped found the Indian National Congress and was its president three times — in 1886, 1893 and 1906; at the 1906 session he declared Swaraj as the goal. In his book Poverty and Un-British Rule in India he argued that Britain was draining India's wealth through salaries, pensions and profits sent home. In 1892 he was elected to the British House of Commons from Finsbury Central, the first Indian to sit there."},
{t:"Bal Gangadhar Tilak",w:"Bal Gangadhar Tilak",img:"Bal_Gangadhar_Tilak_(1856-1920).webp",y:1856,e:1920,d:"1856–1920",era:"frd",r:["West"],c:"per",k:"bal gangadhar tilak lokmanya swaraj is my birthright kesari mahratta ganesh utsav shivaji festival home rule league mandalay gita rahasya lal bal pal extremists",s:"Lokmanya Tilak, the fiery leader who declared 'Swaraj is my birthright and I shall have it'.",x:"Bal Gangadhar Tilak was a teacher, journalist and scholar from Maharashtra who became the most popular leader of the early freedom struggle. Through his newspapers Kesari and Mahratta he criticised British rule, and he turned the Ganesh festival and Shivaji Jayanti into public celebrations that brought people together. With Lala Lajpat Rai and Bipin Chandra Pal — 'Lal-Bal-Pal' — he led the Extremist wing of the Congress. Jailed for sedition, he spent 1908 to 1914 in Mandalay in Burma, where he wrote Gita Rahasya. In 1916 he founded a Home Rule League. He died on 1 August 1920."},
{t:"Gopal Krishna Gokhale",w:"Gopal Krishna Gokhale",img:"GKGokhale.jpg",y:1866,e:1915,d:"1866–1915",era:"frd",r:["West"],c:"per",k:"gopal krishna gokhale moderate congress servants of india society 1905 gandhi political guru imperial legislative council education",s:"Leading Moderate of the Congress, founder of the Servants of India Society, and the man Gandhi called his political guru.",x:"Gopal Krishna Gokhale was a professor in Pune and a member of the Imperial Legislative Council, where his careful speeches on budgets and education won wide respect. As a Moderate, he believed in reform through constitutional means. He presided over the Congress session at Benares in 1905 and in the same year founded the Servants of India Society to train dedicated public workers. He pressed for free and compulsory primary education. Mahatma Gandhi regarded him as his political guru, and Gokhale advised him to travel across India on returning from South Africa. He died in 1915 at the age of 48."},
{t:"Lala Lajpat Rai",w:"Lala Lajpat Rai",img:"Mahatma_Lala_Lajpat_Rai.jpg",y:1865,e:1928,d:"1865–1928",era:"frd",r:["North"],c:"per",k:"lala lajpat rai punjab kesari lion of punjab lal bal pal simon commission lathi charge punjab national bank dav arya samaj saunders",s:"The 'Lion of Punjab', one of the Lal-Bal-Pal trio, who died after a police lathi charge during a protest against the Simon Commission.",x:"Lala Lajpat Rai was a lawyer, writer and Arya Samaj leader from Punjab. He helped found the Punjab National Bank and DAV institutions, and with Tilak and Bipin Chandra Pal formed the Lal-Bal-Pal trio of the Swadeshi period. He was deported to Mandalay in 1907, spent years in the United States during the First World War, and presided over the special Congress session of 1920. On 30 October 1928 he led a protest in Lahore against the Simon Commission and was badly beaten by the police; he died on 17 November. Bhagat Singh and his comrades vowed to avenge his death."},
{t:"Birsa Munda",w:"Birsa Munda",img:"Birsa_Munda,_photograph_in_Roy_(1912-72).JPG",y:1875,e:1900,d:"1875–1900",era:"frd",r:["East"],c:"per",k:"birsa munda dharti aaba ulgulan munda rebellion tribal adivasi jharkhand chotanagpur ranchi janjatiya gaurav divas 15 november",s:"Tribal leader of the Munda people who led the Ulgulan, a great rebellion against British rule and exploitation, in 1899–1900.",x:"Birsa Munda was born in 1875 in the Chotanagpur region of present-day Jharkhand. He saw his people losing their land to outside landlords and moneylenders, and became a religious and social reformer whom followers called Dharti Aaba, 'Father of the Earth'. In 1899 he led the Ulgulan, the 'great tumult', against the British and the landlords. He was captured and died in Ranchi jail in June 1900, aged just 25. The British later passed the Chotanagpur Tenancy Act of 1908 to protect tribal land. His birthday, 15 November, is Jharkhand's foundation day and is observed nationally as Janjatiya Gaurav Divas."},
{t:"Annie Besant",w:"Annie Besant",img:"Annie_Besant_-_portrait.jpg",y:1893,e:1933,d:"1847–1933 · in India from 1893",era:"frd",r:["South", "Pan-India"],c:"per",k:"annie besant theosophical society adyar home rule league 1916 first woman president congress 1917 calcutta central hindu college banaras hindu university new india irish",s:"Irish-born theosophist and freedom fighter who founded a Home Rule League and became the first woman president of the Congress in 1917.",x:"Annie Besant was a British-born social reformer of Irish descent who joined the Theosophical Society and came to India in 1893, making Adyar in Madras her base. She founded the Central Hindu College at Benares in 1898, which became the core of Banaras Hindu University. In 1916 she launched the All India Home Rule League, and her newspaper New India spread its message. Interned by the British in 1917, she was released after protests and elected president of the Congress at its Calcutta session that year — the first woman to hold the post. She died at Adyar in 1933."},
{t:"Dadasaheb Phalke",w:"Dadasaheb Phalke",img:"Phalke.jpg",y:1913,e:1944,d:"1870–1944 · made India's first feature film in 1913",era:"frd",r:["West"],c:"art",k:"dadasaheb phalke father of indian cinema raja harishchandra 1913 first feature film silent dadasaheb phalke award 1969 nashik alam ara",s:"The 'father of Indian cinema', who made India's first full-length feature film, Raja Harishchandra, in 1913.",x:"Dhundiraj Govind Phalke, born in 1870 near Nashik, was a printer and photographer who decided to make films after watching a film on the life of Christ. He produced, directed and filmed Raja Harishchandra, a silent mythological film released in Bombay in 1913 — India's first full-length feature film. He went on to make nearly a hundred films. Since 1969, India's highest award in cinema has been the Dadasaheb Phalke Award. India's first sound film, Alam Ara, followed in 1931."},
{t:"Champaran Satyagraha",w:"Champaran Satyagraha",img:"Dr_Rajendra_Pd._DR.Anugrah_Narayan_Sinha.jpg",y:1917,e:1918,d:"1917",era:"frd",r:["East"],c:"evt",k:"champaran satyagraha 1917 gandhi bihar indigo tinkathia planters raj kumar shukla rajendra prasad first satyagraha in india",s:"Gandhi's first satyagraha in India, in 1917, which won relief for the indigo farmers of Champaran in Bihar.",x:"In Champaran district of Bihar, European planters forced farmers under the tinkathia system to grow indigo on part of their land and pay heavy dues. At the request of a farmer, Raj Kumar Shukla, Gandhi went to Champaran in April 1917. When ordered to leave, he refused and was ready to go to jail, and the authorities backed down. With helpers including Rajendra Prasad, he recorded statements from thousands of farmers. The government set up an inquiry and the tinkathia system was abolished. Champaran made Gandhi a national figure and showed the power of non-violent resistance."},
{t:"Sarojini Naidu",w:"Sarojini Naidu",img:"Sarojini_Naidu_in_1928.jpg",y:1879,e:1949,d:"1879–1949",era:"frd",r:["South", "Pan-India"],c:"per",k:"sarojini naidu nightingale of india poet golden threshold bird of time congress president 1925 kanpur first woman governor united provinces dharasana national women's day 13 february",s:"Poet and freedom fighter known as the 'Nightingale of India', the first Indian woman president of the Congress and India's first woman Governor.",x:"Born in Hyderabad in 1879, Sarojini Naidu studied in England and became a celebrated poet in English with collections such as The Golden Threshold and The Bird of Time. Inspired by Gokhale and Gandhi, she joined the freedom struggle and in 1925 presided over the Kanpur session of the Congress, the first Indian woman to do so. She led volunteers at the Dharasana salt raid in 1930 and was jailed several times. After independence she became Governor of the United Provinces, the first woman Governor in India. Her birthday, 13 February, is celebrated as National Women's Day."},
{t:"Maulana Abul Kalam Azad",w:"Abul Kalam Azad",img:"Maulana_Abul_Kalam_Azad.jpg",y:1888,e:1958,d:"1888–1958",era:"frd",r:["Pan-India"],c:"per",k:"maulana abul kalam azad al hilal khilafat congress president 1923 1940 youngest first education minister iit kharagpur ugc national education day 11 november bharat ratna",s:"Scholar and freedom fighter, the youngest Congress president and independent India's first Education Minister.",x:"Born in Mecca in 1888 and raised in Calcutta, Abul Kalam Azad was a brilliant scholar who started the Urdu weekly Al-Hilal in 1912 to stir nationalist feeling. He joined the Khilafat and Non-Cooperation movements and in 1923, at 35, became the youngest president of the Congress. He led the party again from 1940 to 1946, through the Quit India Movement and talks with the British, and strongly opposed Partition. As India's first Education Minister he helped create the University Grants Commission and the first IIT at Kharagpur. His birthday, 11 November, is National Education Day; he was awarded the Bharat Ratna posthumously in 1992."},
{t:"Rajendra Prasad",w:"Rajendra Prasad",img:"Rajendra_Prasad_(Indian_President),_signed_image_for_Walter_Nash_(NZ_Prime_Minister),_1958_(16017609534).jpg",y:1884,e:1963,d:"1884–1963 · President 1950–1962",era:"frd",r:["East", "Pan-India"],c:"per",k:"dr rajendra prasad first president of india 1950 1962 constituent assembly president champaran bihar desh ratna bharat ratna two terms",s:"India's first President (1950–1962), who also presided over the Constituent Assembly.",x:"Born in Bihar in 1884, Rajendra Prasad was an outstanding student and lawyer who gave up his practice to join Gandhi at Champaran in 1917. He became a key Congress leader, serving as its president several times, and was jailed during the freedom struggle. He presided over the Constituent Assembly that framed the Constitution. In 1950 he became the first President of India and was re-elected in 1952 and 1957 — the only President to be elected twice. He received the Bharat Ratna in 1962."},
{t:"Simon Commission",w:"Simon Commission",img:"The_simon_commission.jpg",y:1928,e:1930,d:"appointed 1927 · arrived 1928",era:"frd",r:["Pan-India"],c:"evt",k:"simon commission 1927 1928 john simon go back boycott no indian member lajpat rai lathi charge nehru report statutory commission",s:"An all-British commission sent in 1928 to review India's constitution, boycotted across India with the cry 'Simon Go Back'.",x:"The British government appointed the Indian Statutory Commission under Sir John Simon in 1927 to study constitutional reform, but none of its seven members was Indian. When it arrived in February 1928 it was met with black flags, strikes and the slogan 'Simon Go Back'. In Lahore, Lala Lajpat Rai was injured in a police lathi charge during a protest and died soon after. Indian leaders responded by drafting their own constitutional proposals, the Nehru Report of 1928. The commission's report of 1930 fed into the Round Table Conferences and the Government of India Act 1935."},
{t:"Round Table Conferences",w:"Round Table Conferences (India)",img:"Mahatma_Gandhi_with_Madeleine_Slade_aboard_the_S.S._Rajputana.jpg",y:1930,e:1932,d:"1930–1932",era:"frd",r:["Pan-India"],c:"evt",k:"round table conferences london 1930 1931 1932 gandhi irwin pact ambedkar communal award poona pact second round table ramsay macdonald",s:"Three conferences in London (1930–32) where Britain and Indian leaders discussed India's future constitution.",x:"The British government held three Round Table Conferences in London between 1930 and 1932. The Congress boycotted the first, as the Civil Disobedience Movement was under way. After the Gandhi–Irwin Pact of March 1931, Gandhi attended the second conference as the Congress's sole representative, but talks broke down over separate electorates for minorities. Dr B. R. Ambedkar attended all three. The British Prime Minister's Communal Award of 1932 followed, leading to Gandhi's fast and the Poona Pact. The discussions shaped the Government of India Act 1935."},
{t:"Chandra Shekhar Azad",w:"Chandra Shekhar Azad",img:"Chandrasekhar_Azad.jpg",y:1906,e:1931,d:"1906–1931",era:"frd",r:["North"],c:"per",k:"chandra shekhar azad chandrashekhar hsra hindustan socialist republican association kakori bhagat singh alfred park allahabad revolutionary",s:"Revolutionary leader of the HSRA who vowed never to be captured alive and died fighting in Allahabad in 1931.",x:"Chandra Shekhar Tiwari joined the Non-Cooperation Movement as a teenager; when a magistrate asked his name, he answered 'Azad' — free — and the name stuck. After Gandhi called off the movement, he joined the revolutionaries, took part in the Kakori train action of 1925 and later led the Hindustan Socialist Republican Association with Bhagat Singh. On 27 February 1931 police surrounded him in Alfred Park, Allahabad; after a gunfight he used his last bullet on himself rather than be captured. The park is now called Chandrashekhar Azad Park."},
{t:"Alluri Sitarama Raju",w:"Alluri Sitarama Raju",img:"Alluri_Sita_Rama_Raju_statue.jpg",y:1897,e:1924,d:"1897–1924 · led the Rampa rebellion 1922–24",era:"frd",r:["South"],c:"per",k:"alluri sitarama raju rampa rebellion manyam 1922 manyam veerudu andhra pradesh godavari tribal forest laws",s:"Revolutionary who led the Rampa (Manyam) rebellion of tribal people in the Godavari hills against British rule in 1922–24.",x:"Alluri Sitarama Raju was a young sannyasi from Andhra who lived among the tribal people of the Eastern Ghats. British forest laws had stopped them using the forests and forced them into labour. In August 1922 he led them in the Rampa rebellion, raiding police stations for weapons and fighting a skilful guerrilla war in the hills. The British needed large forces to suppress it. He was captured and killed in May 1924, aged about 27. He is honoured as Manyam Veerudu, the hero of the forests."},
{t:"Rani Gaidinliu",w:"Rani Gaidinliu",img:"Rani_Gaidinliu_1996_stamp_of_India.jpg",y:1915,e:1993,d:"1915–1993",era:"frd",r:["Northeast"],c:"per",k:"rani gaidinliu naga leader heraka manipur nagaland jadonang jailed 1932 nehru title rani daughter of the hills padma bhushan",s:"Naga spiritual and political leader who rebelled against British rule as a teenager and was given the title 'Rani' by Nehru.",x:"Gaidinliu, from the Rongmei Naga community of Manipur, joined the Heraka religious movement of her cousin Haipou Jadonang at 13. After the British hanged Jadonang in 1931, she led a resistance against them. She was captured in 1932 at the age of 16 and sentenced to life imprisonment. Jawaharlal Nehru met her in jail in 1937, called her a 'daughter of the hills' and gave her the title Rani. Released only after independence, she continued working for her people and received the Padma Bhushan in 1982."},
{t:"Government of India Act 1935",w:"Government of India Act 1935",img:"",y:1935,e:1937,d:"passed 1935 · elections 1937",era:"frd",r:["Pan-India"],c:"evt",k:"government of india act 1935 provincial autonomy federation federal court 1937 elections dyarchy",s:"One of the longest acts ever passed by the British Parliament, which gave India's provinces self-government and became a model for the Constitution.",x:"The Government of India Act 1935 ended dyarchy in the provinces and gave them autonomy, with elected Indian ministers responsible to provincial legislatures. It proposed an all-India federation of provinces and princely states, which never came into being, and set up a Federal Court. Elections held under it in 1937 brought Congress ministries to power in most provinces. Many features of the Act, including the lists dividing powers between the centre and the provinces, were carried into the Constitution of India."},
{t:"Kashmir War of 1947–48",w:"Indo-Pakistani war of 1947–1948",img:"Indian_soldiers_landing_at_Srinagar_airfield_during_the_1947–1948_war.jpg",y:1947,e:1949,d:"October 1947 – January 1949",era:"rep",r:["North"],c:"war",k:"kashmir war 1947 1948 first indo pakistani war tribal invasion maharaja hari singh instrument of accession raiders baramulla ceasefire line of control united nations somnath sharma",s:"The first war between India and Pakistan, fought over Kashmir after its Maharaja acceded to India in October 1947.",x:"In October 1947 tribal raiders and soldiers from Pakistan invaded the princely state of Jammu and Kashmir. Its ruler, Maharaja Hari Singh, signed the Instrument of Accession to India on 26 October, and Indian troops were airlifted to Srinagar the next day. Major Somnath Sharma, killed defending Badgam, became the first recipient of the Param Vir Chakra. India took the matter to the United Nations, and a ceasefire came into effect on 1 January 1949. The ceasefire line left part of the state under Pakistani control; after 1972 it became known as the Line of Control."},
{t:"Bhoodan Movement",w:"Bhoodan movement",img:"Bhoodan_yojana.jpg",y:1951,e:1970,d:"from 1951",era:"rep",r:["Pan-India", "South"],c:"evt",k:"bhoodan movement vinoba bhave land gift 1951 pochampally telangana gramdan sarvodaya padyatra",s:"Vinoba Bhave's 'land gift' movement, begun in 1951, which persuaded landowners to give land to the landless.",x:"Acharya Vinoba Bhave, a close follower of Gandhi and the first individual satyagrahi of 1940, began the Bhoodan movement at Pochampally in Telangana on 18 April 1951, when a landowner offered land for landless families. Walking from village to village across India for years, he collected over four million acres of land as gifts, and the idea grew into Gramdan, the gift of whole villages. He was among the first winners of the Ramon Magsaysay Award in 1958 and received the Bharat Ratna posthumously in 1983."},
{t:"Mother Teresa",w:"Mother Teresa",img:"Mother_Teresa_1.jpg",y:1950,e:1997,d:"1910–1997 · founded the Missionaries of Charity in 1950",era:"rep",r:["East"],c:"per",k:"mother teresa missionaries of charity 1950 kolkata calcutta nobel peace prize 1979 bharat ratna 1980 saint 2016 nirmal hriday",s:"Missionary nun who served the poorest people of Kolkata, founded the Missionaries of Charity and won the Nobel Peace Prize in 1979.",x:"Born Anjezë Gonxhe Bojaxhiu in Skopje in 1910, she came to India as a young nun and taught in Calcutta for many years. In 1948 she began working among the city's poorest people, and in 1950 founded the Missionaries of Charity, which ran homes for the dying, orphans and people with leprosy. She became an Indian citizen and received the Nobel Peace Prize in 1979 and the Bharat Ratna in 1980. She died in 1997 and was declared a saint by the Catholic Church in 2016."},
{t:"Homi J. Bhabha",w:"Homi J. Bhabha",img:"Homi_Jehangir_Bhabha_1960s.jpg",y:1948,e:1966,d:"1909–1966 · led India's atomic programme from 1948",era:"rep",r:["West"],c:"sci",k:"homi jehangir bhabha father of indian nuclear programme tifr tata institute of fundamental research 1945 atomic energy commission 1948 barc trombay three stage thorium mont blanc cosmic rays",s:"Physicist who founded India's nuclear programme and the Tata Institute of Fundamental Research.",x:"Homi Jehangir Bhabha studied at Cambridge and did important work on cosmic rays. Returning to India, he founded the Tata Institute of Fundamental Research in Bombay in 1945 and became the first chairman of the Atomic Energy Commission in 1948. He planned India's three-stage nuclear power programme to make use of the country's thorium reserves, and set up the Atomic Energy Establishment at Trombay, renamed the Bhabha Atomic Research Centre after his death. He died in an Air India plane crash on Mont Blanc in the Alps in January 1966."},
{t:"Vikram Sarabhai",w:"Vikram Sarabhai",img:"Dr_Vikram_Sarabhai_ISRO.webp",y:1962,e:1971,d:"1919–1971 · founded India's space programme",era:"rep",r:["West"],c:"sci",k:"vikram sarabhai father of indian space programme isro incospar 1962 thumba physical research laboratory prl iim ahmedabad",s:"Scientist who founded India's space programme and ISRO.",x:"Vikram Sarabhai came from a family of Ahmedabad industrialists and founded the Physical Research Laboratory there in 1947. Convinced that space technology could help a developing nation with communication, weather forecasting and education, he persuaded the government to set up the Indian National Committee for Space Research in 1962, which became ISRO in 1969. He chose Thumba near Thiruvananthapuram as India's first rocket launch site and helped found the Indian Institute of Management Ahmedabad. He died suddenly in 1971. The Vikram landers of the Chandrayaan missions are named after him."},
{t:"Sino-Indian War of 1962",w:"Sino-Indian War",img:"Indian_soldiers_on_patrol_during_the_1962_Sino-Indian_border_war.jpg",y:1962,e:1962,d:"October–November 1962",era:"rep",r:["North", "Northeast"],c:"war",k:"sino indian war 1962 china aksai chin nefa arunachal mcmahon line tawang rezang la shaitan singh ceasefire",s:"A short border war in October–November 1962 in which China defeated India in Aksai Chin and the North-East Frontier Agency.",x:"Disputes over the border — Aksai Chin in Ladakh in the west and the McMahon Line in the east — grew after China took control of Tibet. In October 1962 Chinese forces attacked in both sectors. Indian troops, poorly equipped for high-altitude warfare, fought bravely in places such as Rezang La, where Major Shaitan Singh and his men held out to the last, but were pushed back. China declared a ceasefire on 21 November and withdrew in the east while keeping Aksai Chin. The defeat led India to modernise and expand its armed forces."},
{t:"Lal Bahadur Shastri",w:"Lal Bahadur Shastri",img:"Lal_Bahadur_Shastri_(from_stamp).jpg",y:1964,e:1966,d:"1904–1966 · Prime Minister 1964–1966",era:"rep",r:["North", "Pan-India"],c:"per",k:"lal bahadur shastri second prime minister jai jawan jai kisan 1965 war tashkent white revolution green revolution railway minister resigned bharat ratna",s:"India's second Prime Minister, who led the country in the 1965 war and gave the slogan 'Jai Jawan Jai Kisan'.",x:"Lal Bahadur Shastri was a soft-spoken freedom fighter from Uttar Pradesh, famous for his honesty: as Railway Minister he resigned, taking moral responsibility for a train accident. He became Prime Minister after Nehru's death in 1964. During the 1965 war with Pakistan he raised the slogan 'Jai Jawan Jai Kisan' to honour soldiers and farmers, and he supported the drives that became the White and Green Revolutions. He died in Tashkent on 11 January 1966, a day after signing a peace agreement with Pakistan. He was the first person to be awarded the Bharat Ratna posthumously."},
{t:"Indo-Pakistani War of 1965",w:"Indo-Pakistani war of 1965",img:"1965_Indo-Pak_War_DestroyedShermanTank.jpg",y:1965,e:1966,d:"August–September 1965",era:"rep",r:["North", "West"],c:"war",k:"1965 war indo pakistani operation gibraltar rann of kutch asal uttar khem karan abdul hamid tashkent agreement shastri ceasefire",s:"A war between India and Pakistan in 1965, sparked by Pakistan's attempt to stir revolt in Kashmir, which ended in a ceasefire and the Tashkent Agreement.",x:"After clashes in the Rann of Kutch in early 1965, Pakistan launched Operation Gibraltar in August, sending infiltrators into Jammu and Kashmir. Full-scale war followed in September, with major tank battles in Punjab such as Asal Uttar, where Company Quartermaster Havildar Abdul Hamid destroyed several enemy tanks and was awarded the Param Vir Chakra posthumously. A United Nations ceasefire came into effect on 23 September. In January 1966 Prime Minister Lal Bahadur Shastri and President Ayub Khan signed the Tashkent Agreement, mediated by the Soviet Union."},
